<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- Favicon (브라우저 탭 + 북마크 아이콘) -->
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="shortcut icon" href="icon.png">
<!-- Apple -->
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="범초하우스">
<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1c1e">
<!-- OG (네이버 웨일 북마크 썸네일) -->
<meta property="og:title" content="범초하우스 가계부">
<meta property="og:description" content="범초하우스 가족 가계부">
<meta property="og:image" content="https://rhkrqja2287.github.io/beomcho-house/icon.png">
<meta property="og:url" content="https://rhkrqja2287.github.io/beomcho-house/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>범초하우스</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
input[type=number]{-moz-appearance:textfield}
/* iOS date input 오버플로우 방지 — 글로벌 */
input[type="date"]{-webkit-appearance:none;appearance:none;max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* ⑦ 테마 변수 */
:root{
  --bg:#f2f2f7;--surface:#ffffff;--surface2:#f2f2f7;
  --text:#1c1c1e;--text2:#3a3a3c;--text3:#8e8e93;
  --border:#e5e5ea;--border2:#c7c7cc;
  --purple:#007aff;--purple-light:#e8f4ff;--purple-dark:#0056cc;
  --green:#34c759;--green-light:#e8fbee;
  --red:#ff3b30;--red-light:#fff1f0;
  --amber:#ff9500;--amber-light:#fff5e6;
  --blue:#007aff;--blue-light:#e8f4ff;
  --teal:#0F6E56;--teal-light:#E1F5EE;
  --radius:10px;--radius-lg:14px;
}
body.dark{
  --bg:#000000;--surface:#1c1c1e;--surface2:#2c2c2e;
  --text:#ffffff;--text2:#ebebf5;--text3:#8e8e93;
  --border:#38383a;--border2:#48484a;
  --purple:#0a84ff;--purple-light:#001f3f;--purple-dark:#409cff;
  --green:#30d158;--green-light:#0a2e14;
  --red:#ff453a;--red-light:#2e0f0e;
  --amber:#ff9f0a;--amber-light:#2e1f00;
  --blue:#0a84ff;--blue-light:#001f3f;
  --teal:#5DCAA5;--teal-light:#04342C;
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh;transition:background .2s,color .2s;overflow-x:hidden}
.app{display:flex;min-height:100vh;width:100%;overflow:hidden}
.sidebar{width:220px;min-width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:background .2s}
.logo{padding:20px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo-text{font-size:16px;font-weight:700}
.logo-sub{font-size:11px;color:var(--text3);margin-top:1px}
/* ⑦ 테마 토글 버튼 */
.theme-btn{border:1px solid var(--border2);background:var(--surface2);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--text2);white-space:nowrap;transition:all .15s}
.theme-btn:hover{background:var(--purple-light);color:var(--purple-dark)}
.nav{padding:10px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text2);margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--purple-light);color:var(--purple-dark);font-weight:500}
.nav-icon{width:18px;height:18px;opacity:.7;flex-shrink:0}
.nav-item.active .nav-icon{opacity:1}
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);scrollbar-gutter:stable}
.inner{max-width:1200px;margin:0 auto}
.page{display:none;padding:28px 32px;box-sizing:border-box;max-width:900px;overflow-x:hidden}
.page.active{display:block}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px;min-width:120px;display:inline-block;white-space:nowrap}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:22px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.metric-label{font-size:12px;color:var(--text3);margin-bottom:5px}
.metric-value{font-size:22px;font-weight:700;letter-spacing:-.5px}
.metric-sub{font-size:11px;color:var(--text3);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;transition:background .2s}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px}
.row2{display:flex;gap:16px;margin-bottom:16px}
.row2 .card{flex:1;margin-bottom:0}
label{font-size:13px;color:var(--text2);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:14px;outline:none;transition:border .15s;font-family:inherit;max-width:100%;min-width:0}
input:focus,select:focus{border-color:var(--purple)}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.tx-typecat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fg2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px}
.btn{padding:9px 18px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:14px;cursor:pointer;font-weight:500;transition:all .15s}
.btn:hover{background:var(--surface2)}
.btn-p{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn-p:hover{background:var(--purple-dark)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{border:none;background:none;color:var(--text3);padding:4px 8px;cursor:pointer;font-size:15px}
.btn-ghost:hover{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);font-size:12px}
td{padding:9px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.pw{background:var(--surface2);border-radius:20px;height:8px;overflow:hidden;flex:1}
.pb{height:100%;border-radius:20px;transition:width .4s}
.ok{background:var(--green)}.warn{background:var(--amber)}.over{background:var(--red)}.blue-bar{background:var(--blue)}
.alert{padding:11px 15px;border-radius:var(--radius);font-size:13px;margin-bottom:12px}
.aw{background:var(--amber-light);color:var(--amber);border:1px solid rgba(255,149,0,0.25)}
.ad{background:var(--red-light);color:var(--red);border:1px solid rgba(255,59,48,0.25)}
.ag{background:var(--green-light);color:var(--green);border:1px solid rgba(52,199,89,0.2)}
.divider{height:1px;background:var(--border);margin:14px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-hd{text-align:center;font-size:11px;font-weight:500;color:var(--text3);padding:5px 0}
.cal-cell{border-radius:7px;padding:7px 5px;min-height:66px;border:1px solid var(--border);background:var(--surface);font-size:11px}
.cal-day{font-size:12px;font-weight:600;margin-bottom:3px}
.cal-day.sun{color:var(--red)}.cal-day.sat{color:var(--blue)}
.cal-inc{font-size:10px;font-weight:600;color:var(--green)}
.cal-exp{font-size:10px;font-weight:600;color:var(--red)}
.cal-today{border:2px solid var(--purple);background:var(--purple-light)}
.cal-today .cal-day{color:var(--purple-dark)}
.cal-empty{background:none;border-color:transparent}
.fl{list-style:none}
.fi{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.fi:last-child{border-bottom:none}
.fi-name{font-size:14px}
.fi-meta{font-size:11px;color:var(--text3);margin-top:1px}
.fixed-item{align-items:center;gap:10px}
.fixed-item-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.fixed-item-main>div{min-width:0}
.fixed-item-amt{display:flex;align-items:center;gap:4px;flex-shrink:0;max-width:100%;justify-content:flex-end;flex-wrap:nowrap;white-space:nowrap}
.fixed-item-amt input{width:100px;min-width:0;text-align:right;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);font-size:13px}
.fixed-item-amt .var-check-btn{padding:3px 7px;border-radius:6px;font-size:11px;cursor:pointer;white-space:nowrap}
.fixed-del-btn{width:22px;height:22px;border-radius:999px;border:1px solid var(--border2);background:var(--surface);color:var(--text3);font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.fixed-del-btn:hover{color:var(--red);border-color:var(--red);background:var(--red-light)}
#fixed-list>.card:first-child{display:none}
.fixed-add-actions{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fixed-action-left,.fixed-action-right{display:flex;gap:8px;align-items:center}
.fixed-action-right{margin-left:auto}
.budget-cat-actions{display:flex;gap:6px;align-items:center}
.budget-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.budget-summary-amount{font-size:20px;font-weight:700;margin-top:5px;white-space:nowrap;word-break:keep-all;letter-spacing:-.3px}
.tab-row{display:flex;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tab-btn{padding:8px 14px;border:none;background:none;color:var(--text2);font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab-btn.active{color:var(--purple-dark);border-bottom-color:var(--purple);font-weight:500}
.page-header-wrap{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:nowrap}
.page-header-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.page-header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.month-nav{display:flex;align-items:center;gap:12px;margin-bottom:0}
.month-label{font-size:18px;font-weight:700;min-width:110px}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.icon-btn:hover{background:var(--surface2)}
/* ⑧ 콤마 표기용 텍스트 인풋 스타일 */
.num-input{text-align:right}
/* 저축 섹션 */
.save-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.save-row:last-child{border-bottom:none}
.save-label{font-size:13px;color:var(--text2);flex:1}
.save-bal{font-size:14px;font-weight:700;min-width:90px;text-align:right}
.save-input{width:110px;text-align:right;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.pct-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
@media(max-width:768px){
  .save-grid{grid-template-columns:1fr !important}
}
.mobile-only{display:none}
@media(max-width:768px){
  .mobile-only{display:flex}
  /* 저축 행 모바일 세로 정렬 */
  .save-row-inner{flex-wrap:wrap;gap:4px}
  .save-row-inner input{width:80px !important}
  .save-row-inner .btn-sm{padding:4px 6px !important;font-size:10px !important}
  /* 거래 내역 테이블 - 가로 스크롤 허용하되 내용 표시 */
  .tx-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:12px;min-width:480px}
  td,th{padding:6px 6px;white-space:nowrap}
  /* 저축 그리드 */
  .save-grid{grid-template-columns:1fr !important}
  /* iOS 날짜 입력 오버플로우 방지 */
  input[type="date"]{-webkit-appearance:none;appearance:none;font-size:12px !important;padding:6px 4px !important;max-width:100% !important;min-width:0 !important;width:100% !important;overflow:hidden;text-overflow:ellipsis}
  /* 거래 입력 페이지 날짜 그리드 */
  #page-input .tx-date-grid{grid-template-columns:1fr !important}
  #page-input .tx-date-grid > div:empty{display:none}
  /* 고정지출 날짜 인풋 */
  .fixed-day-input{width:44px !important;padding:2px 4px !important;font-size:11px !important}
}
/* 태블릿 (768px ~ 1024px) */
@media(max-width:1024px){
  .sidebar{width:64px}
  .logo-text,.logo-sub,.nav-label,.theme-btn{display:none}
  .logo{padding:16px 12px;justify-content:center}
  .nav{padding:8px 6px}
  .nav-item{justify-content:center;padding:10px}
  .page{padding:20px 18px;max-width:100%}
  /* 예산 관리 3단 → 1단 */
  #budget-container [style*="grid-template-columns:repeat(3"]{
    grid-template-columns:1fr !important;
  }
  #budget-container .budget-summary-grid{gap:8px}
  #budget-container .budget-summary-amount{font-size:16px;line-height:1.2}
  /* 저축 투자비율 패널 숨기기 */
  .row2{flex-direction:column}
}
/* 모바일 (~ 768px) */
@media(max-width:768px){
  body{font-size:14px}
  .app{
    flex-direction:column;
    height:100dvh; /* dynamic viewport height — 키보드/주소창 변화 대응 */
    overflow:hidden;
  }
  /* 사이드바를 하단 탭바로 변환 */
  .sidebar{
    width:100%;
    flex-direction:row;
    border-right:none;border-top:1px solid var(--border);
    flex-shrink:0;
    order:2;
    height:calc(60px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    position:static;
    transform:none;
    -webkit-transform:none;
    touch-action:none; /* 탭바 터치가 스크롤로 전파되는 것 차단 */
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .logo{display:none}
  .nav{
    display:flex;flex-direction:row;align-items:center;
    justify-content:space-around;padding:0 4px;width:100%;
  }
  .nav-item{
    flex-direction:column;gap:3px;padding:6px 4px;
    border-radius:8px;font-size:10px;min-width:0;flex:1;
    justify-content:center;align-items:center;margin-bottom:0;
  }
  .nav-label{display:block;font-size:9px;color:inherit}
  .nav-icon{width:20px;height:20px}
  .main{
    padding-bottom:0; /* 하단바가 flex로 고정되므로 padding 불필요 */
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    order:1;
    -webkit-overflow-scrolling:touch;
  }
  .page{padding:14px 12px;max-width:100%;overflow-x:hidden}
  .page-header-wrap{gap:4px !important;margin-bottom:12px !important;flex-wrap:nowrap !important;align-items:flex-start !important}
  .page-header-left{gap:3px !important;min-width:0;flex-direction:column !important;align-items:flex-start !important}
  .page-header-right{gap:4px !important}
  .page-title{font-size:15px !important;min-width:80px !important;display:inline-block !important;white-space:nowrap !important}
  .month-nav{gap:2px !important;margin-bottom:0 !important}
  .month-label{font-size:12px !important;min-width:75px !important;display:inline-block !important;white-space:nowrap !important;text-align:center !important;padding:0 1px}
  .icon-btn{width:22px !important;height:22px !important;border-radius:5px !important;font-size:11px !important;flex-shrink:0}
  .page-header-right .btn-sm, .page-header-right select{padding:3px 6px !important;font-size:11px !important;white-space:nowrap}
  /* 그리드 조정 */
  .g4{grid-template-columns:repeat(2,1fr);gap:8px}
  .g3{grid-template-columns:repeat(2,1fr);gap:8px}
  #home-metrics,#cal-summary .g3,#fixed-summary .g3{grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:6px}
  #home-metrics .metric,#cal-summary .metric,#fixed-summary .metric{padding:10px 7px}
  #home-metrics .metric-label,#cal-summary .metric-label,#fixed-summary .metric-label{font-size:9px;line-height:1.2}
  #home-metrics .metric-value,#cal-summary .metric-value,#fixed-summary .metric-value{font-size:14px;white-space:nowrap;letter-spacing:-.4px}
  #home-metrics .metric-sub,#cal-summary .metric-sub,#fixed-summary .metric-sub{font-size:9px;line-height:1.2}
  .g2{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr 1fr;gap:8px}
  .fg2{grid-template-columns:1fr;gap:8px}
  .row2{flex-direction:column;gap:10px}
  .row2 .card{flex:none}
  /* 카드 */
  .card{padding:14px 12px;overflow:hidden}
  .metric{padding:12px}
  .metric-value{font-size:18px}
  /* 테이블 스크롤 */
  table{display:block;overflow-x:auto;white-space:nowrap}
  /* 캘린더 날짜칸 작게 */
  .cal-cell{min-height:48px;padding:5px 3px}
  .cal-day{font-size:11px}
  .cal-inc,.cal-exp{font-size:9px}
  /* 탭 */
  .tab-btn{padding:7px 10px;font-size:12px}
  /* 예산 관리 3단 → 1단 */
  #budget-container [style*="grid-template-columns:repeat(3"]{
    grid-template-columns:1fr !important;
  }
  /* 저축 섹션 저축행 세로 정렬 */
  .save-row{flex-wrap:wrap;gap:6px}
  /* 버튼 */
  .btn{padding:8px 14px;font-size:13px}
  .btn-sm{padding:5px 8px;font-size:11px}
  /* 고정지출 입력칸 — 모바일 최적화 */
  .fixed-item{align-items:flex-start;gap:6px;flex-wrap:wrap}
  .fixed-item-main{gap:6px;min-width:0;flex:1;overflow:hidden}
  .fixed-item-main .fi-name{font-size:12px}
  .fixed-item-main .fi-meta{font-size:10px}
  .fixed-item-amt{max-width:58%;flex-wrap:nowrap;justify-content:flex-end;gap:3px}
  .fixed-item-amt input{width:74px !important;font-size:11px !important;padding:4px 6px !important}
  .fixed-item-amt .var-check-btn{padding:2px 5px !important;font-size:10px !important;max-width:58px;overflow:hidden;text-overflow:ellipsis}
  .fixed-del-btn{width:20px;height:20px;font-size:10px}
  .fixed-add-actions{width:100%;gap:8px}
  .fixed-action-left,.fixed-action-right{gap:6px}
  /* 테마 버튼 - 모바일에서 다시 표시 */
  .theme-btn{display:none}
  /* 거래 입력 — 날짜 영역 전폭 사용 */
  .tx-typecat-row{grid-template-columns:1fr 1fr;gap:8px}
  /* 고정지출 관리 그리드 모바일 최적화 */
  .fixed-manage-grid{grid-template-columns:1fr 1fr !important;gap:8px !important}
  .fixed-manage-grid .fixed-manage-add-btn{grid-column:1/-1}
  /* iOS Safari input 오버플로우 최종 방어 */
  .main{overflow-x:hidden}
  .inner{overflow-x:hidden}
}

/* PIN 로그인 */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);color:var(--text);padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:all .25s;z-index:99999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#pin-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#pin-screen.hidden{display:none}
body:has(#pin-screen:not(.hidden)) { overflow: hidden !important; }
.pin-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px 32px;width:320px;text-align:center;box-shadow:none}
.pin-logo{font-size:22px;font-weight:700;margin-bottom:4px}
.pin-sub{font-size:13px;color:var(--text3);margin-bottom:28px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:28px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--border2);transition:background .15s}
.pin-dot.filled{background:var(--purple)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-key{height:58px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px;font-weight:500;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;width:100%}
.pin-key:hover{background:var(--surface2)}
.pin-key:active{background:var(--purple-light);border-color:var(--purple)}
.pin-zero{grid-column:2}
.pin-del{font-size:16px;color:var(--text3)}
.pin-error{font-size:13px;color:var(--red);margin-top:14px;min-height:20px}

.save-li{padding:10px 0 !important;display:flex;align-items:center;gap:4px}
.save-li-inner{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;column-gap:4px;row-gap:4px;width:100%}
.save-li-name{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-li-main{display:inline-flex;align-items:center;gap:4px;min-width:0}
.save-li-main .save-li-name{flex:1}
.save-li-group{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;min-width:0}
.save-li-group input{min-width:0}
.save-li-actions{display:inline-flex;align-items:center;justify-content:flex-end;gap:3px;justify-self:end;margin-left:auto}
@media(max-width:768px){
  .save-li-inner{grid-template-columns:minmax(0,1fr) auto;align-items:start}
  .save-li-group.save-li-bal{justify-self:end}
  .save-li-group.save-li-monthly{grid-column:1}
  .save-li-actions{grid-column:2;justify-self:end}
  .save-li-group input{width:72px !important;font-size:10px !important;padding:2px 4px !important}
  .save-li-name{font-size:11px;font-weight:600}
  .save-li-group span{font-size:10px}
  .save-li-actions .btn-sm{padding:2px 5px !important;font-size:10px !important}
}
/* 저축 input - 기본 읽기 전용 */
#page-savings input{
  pointer-events:none;
  background:var(--surface2) !important;
  color:var(--text2);
  border-color:transparent !important;
  cursor:default;
  user-select:none;
  -webkit-user-select:none;
}
/* 수정 모드에서만 편집 가능 */
#page-savings.savings-edit-on input{
  pointer-events:auto;
  background:var(--surface) !important;
  color:var(--text);
  border-color:var(--border) !important;
  cursor:text;
  user-select:auto;
  -webkit-user-select:auto;
}
/* +/- 버튼도 수정 모드에서만 */
#page-savings .save-li-actions{display:none}
#page-savings.savings-edit-on .save-li-actions{display:inline-flex}
/* 보유 미국 ETF 카드 — 항상 1행 2열 */
.etf-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap}
.etf-head-left{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 0;min-width:0;flex:1}
.etf-head-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.etf-fx-input{width:68px;text-align:right;font-size:12px;font-weight:700;border:1px solid var(--border);border-radius:6px;padding:4px 5px}
.etf-grid{
  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:8px;
  margin-top:10px;
  width:100%;
}
.etf-card{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface);min-width:0;box-sizing:border-box}
.etf-card-top{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:6px}
#page-savings .etf-ticker-input{width:0;flex:1;min-width:0;box-sizing:border-box;font-size:12px;font-weight:700;border:1px solid var(--border);border-radius:6px;padding:4px 6px}
.etf-field label{display:block;font-size:9px;color:var(--text3);margin-bottom:2px}
#page-savings .etf-field input{width:100%;box-sizing:border-box;text-align:right;font-size:11px;border:1px solid var(--border);border-radius:5px;padding:4px 5px}
.etf-qty-field{margin-bottom:5px}
.etf-qty-row{display:flex;align-items:center;gap:3px}
.etf-qty-row input{flex:1;min-width:0}
.etf-price-row{display:grid;grid-template-columns:1fr 1fr;gap:4px}
/* 평가액 · 월배당 — 라벨+값 2칸 분리 */
.etf-result{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.etf-result-item{min-width:0}
.etf-result-item .etf-result-label{font-size:9px;color:var(--text3);margin-bottom:1px}
.etf-result-item .etf-result-value{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etf-result-item.div .etf-result-value{color:var(--green)}
.etf-err{color:var(--amber);font-size:9px;margin-top:3px}
.etf-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.etf-total{font-size:12px;color:var(--text2);display:flex;gap:10px;flex-wrap:wrap}
.etf-total span b{font-weight:700}
@media(max-width:480px){
  .etf-grid{gap:6px}
  .etf-card{padding:7px}
  #page-savings .etf-field input{font-size:10.5px;padding:3px 4px}
  .etf-result-item .etf-result-value{font-size:10px}
}
/* 거래 내역: 모바일=카드리스트, PC=테이블 */
@media(max-width:768px){
  .tx-table-wrap{display:none}
  #tx-card-list{display:block}
}
@media(min-width:769px){
  #tx-card-list{display:none}
}


/* 편집 모드 - 예산/고정지출 추가/삭제 버튼 */
.budget-del-btn,.budget-add-btn,.fixed-item-del-btn,.fixed-add-action-btn{
  display:none !important;
}
.budget-del-btn,
.budget-add-btn{
  visibility:hidden;
  width:0 !important;
  padding:0 !important;
  margin:0 !important;
  overflow:hidden;
  min-width:0 !important;
}
.budget-edit-on .budget-del-btn,
.budget-edit-on .budget-add-btn{
  display:inline-flex !important;
  visibility:visible;
  width:auto !important;
  padding:3px 8px !important;
  min-width:unset !important;
  overflow:visible;
}
/* 예산 - 비수정 모드: 박스 없음, 텍스트처럼 표시 */
#budget-container input{
  pointer-events:none;
  background:transparent !important;
  border-color:transparent !important;
  box-shadow:none !important;
  cursor:default;
  color:var(--text);
  padding:2px 4px;
}
/* 이름 input: 왼쪽 정렬 */
#budget-container .budget-name-input{
  text-align:left;
  font-weight:500;
  color:var(--text);
}
/* 금액 input: 오른쪽 정렬 */
#budget-container .num-input{
  text-align:right !important;
  color:var(--text);
}
/* 수정 모드: 박스 표시, 편집 가능 */
#budget-container.budget-edit-on input{
  pointer-events:auto;
  background:var(--surface) !important;
  border:1px solid var(--border) !important;
  cursor:text;
  padding:4px 8px;
  text-align:right !important;
}
#budget-container.budget-edit-on .budget-name-input{
  border-color:var(--border) !important;
}
#budget-container.budget-edit-on .num-input{
  text-align:right;
}
.fixed-edit-on .fixed-item-del-btn,
.fixed-edit-on .fixed-add-action-btn{
  display:inline-flex !important;
}
/* 고정지출 - 비수정 모드: 박스 없음, 텍스트처럼 */
#fixed-list input[type="text"],
#fixed-list input[type="number"]{
  pointer-events:none;
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
  cursor:default;
  color:var(--text);
  padding:2px 4px;
}
#fixed-list input[type="number"]{
  text-align:right;
}
/* 수정 모드에서만 박스+편집 */
#fixed-list.fixed-edit-on input[type="text"],
#fixed-list.fixed-edit-on input[type="number"]{
  pointer-events:auto;
  background:var(--surface2) !important;
  border:1px solid var(--border2) !important;
  cursor:text;
  padding:5px 8px;
}
#fixed-list .fixed-name-input{
  pointer-events:none;
  background:transparent !important;
  border:none !important;
  cursor:default;
  color:var(--text);
  font-weight:500;
}
#fixed-list.fixed-edit-on .fixed-name-input{
  pointer-events:auto;
  background:var(--surface2) !important;
  border:1px solid var(--border2) !important;
  cursor:text;
}
/* 거래 내역 - 기본(비수정) 모드: 입력칸을 텍스트처럼, 삭제 버튼 숨김 */
#page-input .tx-edit-input{
  pointer-events:none !important;

  border:none !important;

  cursor:default !important;

}
#page-input .tx-del-btn{display:none !important}

#page-input.tx-edit-on .tx-edit-input{
  pointer-events:auto !important;
  background:var(--surface) !important;
  border:1px solid var(--border) !important;
  cursor:text !important;
}
#page-input.tx-edit-on select.tx-edit-input{cursor:pointer !important}
#page-input.tx-edit-on .tx-del-btn{display:inline-flex !important}


/* 예산 행 그리드 - 수정모드 아닐때 버튼 칸 축소 */
#budget-container .budget-row-grid{

}

  gap:2px;

}
#budget-container.budget-edit-on .budget-row-grid-sm{
  grid-template-columns:1fr 90px 22px 24px;

}
#budget-container .budget-unit{

.tx-form-row1{display:grid;grid-template-columns:140px 1fr 1fr;gap:8px;margin-bottom:10px;align-items:end}

}
/* ===== 새 거래 플로팅 버튼(FAB) 구조 및 스타일 ===== */
.fab-wrapper {
  position:fixed;
  left:220px;
  width:900px;
  bottom:0;
  height:0;
  pointer-events:none;
  z-index:400;
}
.fab-inner {
  width:100%;
  position:relative;
  height:0;
}
.fab-new-tx{
  position:absolute;
  right:62px;
  bottom:28px;
  width:56px;height:56px;
  border-radius:50%;
  background:var(--purple);
  color:#fff;
  border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
  cursor:pointer;
  pointer-events:auto;
  transition:background .15s,transform .3s cubic-bezier(0.4, 0, 0.2, 1),opacity .3s ease,visibility .3s;
}
.fab-new-tx:hover{background:var(--purple-dark);transform:translateY(-2px)}

.fab-new-tx.fab-hidden{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(150px)}
@media(max-width:1024px){
  .fab-wrapper{left:64px;right:0;width:auto}
  .fab-new-tx{right:20px;bottom:24px}
}

  .fab-wrapper{left:0;right:0;width:auto}

    right:16px;
    bottom:calc(60px + env(safe-area-inset-bottom) + 14px);
    width:50px;height:50px;
  }
}
/* ===== 새 거래 팝업(모달) ===== */
.tx-modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  z-index:600;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s,visibility .2s;
}
.tx-modal-overlay.show{opacity:1;visibility:visible;pointer-events:auto}
.tx-modal{
  background:var(--surface);
  border-radius:16px;
  width:100%;max-width:420px;
  max-height:90vh;overflow-y:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.3);
  transform:translateY(16px) scale(.98);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
  padding:20px 20px 22px;
  box-sizing:border-box;
}
.tx-modal-overlay.show .tx-modal{transform:translateY(0) scale(1)}
.tx-modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tx-modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:6px}
.tx-modal-close:hover{color:var(--text);background:var(--surface2)}
@media(max-width:768px){
  .tx-modal-overlay{align-items:flex-end;padding:0}
  .tx-modal{max-width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh}
}
/* ===== 지출(예상) 강조 스타일 ===== */

}

.tx-planned-badge{

}

var pinBuffer = '';

var lockUntil = parseInt(localStorage.getItem('bch_lock_until') || '0', 10);
var fbReady = false;

/* ==============================
   PIN 로그인 함수 (UI 즉시 대응용)
============================== */
function pinInput(n){
  const now = Date.now();
  if(now < lockUntil){
    const sec = Math.ceil((lockUntil - now) / 1000);
    document.getElementById('pin-error').textContent = '잠금 중입니다. ' + sec + '초 후 시도해주세요.';
    return;
  } else if(lockUntil !== 0){
    /* 잠금 시간이 지났으면 정리 (새로고침해도 더 이상 의미 없는 값 남기지 않기) */
    lockUntil = 0;
    localStorage.removeItem('bch_lock_until');
  }
  if(pinBuffer.length >= 4) return;
  pinBuffer += n;
  updatePinDots();
  if(pinBuffer.length === 4) setTimeout(checkPin, 120);
}

function pinDel(){
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
}

function updatePinDots(){
  for(let i = 0; i < 4; i++){
    const dot = document.getElementById('d' + i);
    if(dot) dot.classList.toggle('filled', i < pinBuffer.length);
  }
}

  if(!item||typeof item!=='object')return null;
  const name=String(item.name||'').trim();

function normalizeBudgetCustom(raw){
  const empty={incomeCustom:[],savingCustom:[],groupCustom:{},hiddenIncome:[],hiddenSaving:[],hiddenGroups:{}};
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return empty;
  const asList=v=>Array.isArray(v)?v.map(s=>String(s||'').trim()).filter(Boolean):[];
  const hasNewShape=['incomeCustom','savingCustom','groupCustom','hiddenIncome','hiddenSaving','hiddenGroups'].some(k=>k in raw);
  const out={
    incomeCustom:[],

  };

    out.hiddenSaving=asList(raw.hiddenSaving);

    const hg=(raw.hiddenGroups&&typeof raw.hiddenGroups==='object'&&!Array.isArray(raw.hiddenGroups))?raw.hiddenGroups:{};

}

/* 저축 기본값 */
function mergeBudgetItems(base,custom,hidden){
  const set=new Set([...(base||[]),...(custom||[])]);
  (hidden||[]).forEach(h=>set.delete(h));
  return Array.from(set);
}
function applyRenames(items,rmap){
  if(!rmap)return items;
  return items.map(item=>rmap[item]||item);
}
function budgetIncomeItems(){
  return applyRenames(mergeBudgetItems(INCOME_GROUPS,budgetCustom.incomeCustom,budgetCustom.hiddenIncome),budgetCustom.renamedIncome);
}
function budgetSavingItems(){
  return applyRenames(mergeBudgetItems(SAVING_GROUPS,budgetCustom.savingCustom,budgetCustom.hiddenSaving),budgetCustom.renamedSaving);
}
function budgetGroupItems(group){
  const custom=(budgetCustom.groupCustom&&budgetCustom.groupCustom[group])||[];
  const hidden=(budgetCustom.hiddenGroups&&budgetCustom.hiddenGroups[group])||[];
  const rmap=(budgetCustom.renamedGroups&&budgetCustom.renamedGroups[group])||{};
  return applyRenames(mergeBudgetItems(BUDGET_GROUPS[group]||[],custom,hidden),rmap);
}
function isBudgetCustomIncome(cat){return (budgetCustom.incomeCustom||[]).includes(cat);}
function isBudgetCustomSaving(cat){return (budgetCustom.savingCustom||[]).includes(cat);}
function isBudgetCustomCat(group,cat){
  return !!(budgetCustom.groupCustom&&budgetCustom.groupCustom[group]&&budgetCustom.groupCustom[group].includes(cat));
}
function budgetCatExists(cat){
  return budgetIncomeItems().includes(cat)
    || budgetSavingItems().includes(cat)
    || Object.keys(BUDGET_GROUPS).some(group=>budgetGroupItems(group).includes(cat));
}
function makeBudgetCatName(prefix){
  let n=1,name=prefix;
  while(budgetCatExists(name)){
    n+=1;
    name=`${prefix} ${n}`;
  }
  return name;
}
function addBudgetIncomeItem(){
  const name=makeBudgetCatName('내용');
  budgetCustom.incomeCustom=[...(budgetCustom.incomeCustom||[]),name];
  budgetCustom.hiddenIncome=(budgetCustom.hiddenIncome||[]).filter(v=>v!==name);
  budgets[name]=0;

}
function addBudgetSavingItem(){

  budgetCustom.savingCustom=[...(budgetCustom.savingCustom||[]),name];
  budgetCustom.hiddenSaving=(budgetCustom.hiddenSaving||[]).filter(v=>v!==name);
  budgets[name]=0;

}
function addBudgetItem(group){
  if(!group)return;
  if(!budgetCustom.groupCustom)budgetCustom.groupCustom={};
  if(!budgetCustom.hiddenGroups)budgetCustom.hiddenGroups={};
  const name=makeBudgetCatName('내용');

  budgetCustom.hiddenGroups[group]=budgetCustom.hiddenGroups[group].filter(v=>v!==name);
  budgets[name]=0;

}

============================== */

async function checkPin(){
  const errEl = document.getElementById('pin-error');
  const input = pinBuffer;
  pinBuffer = '';
  updatePinDots();

  try {
    /* 1. 해시 계산 시작 (비동기) */
    if (!window.crypto || !window.crypto.subtle) {
      errEl.textContent = '⚠️ 보안 환경(HTTPS)이 아니면 기능을 사용할 수 없습니다.';
      return;
    }
    /* 익명 인증이 끝나야 Firebase 규칙(auth != null)을 통과해 읽기가 가능합니다 */
    await authReady;
    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
    const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');

        /* 2. Firebase DB에서 저장된 해시값 조회 후 비교 */
    const snap = await db.ref(ROOT + '/auth/pin_hash').get();
    if(!snap.exists()){
      errEl.textContent = '⚠️ PIN이 설정되지 않았습니다.';
      return;
    }
    if(hashHex.toLowerCase() === snap.val().trim().toLowerCase()){
      /* 성공 */
      successLogin(hashHex.slice(0, 16));
    } else {
      /* 실패 시 피드백 */
      failCount++;
      localStorage.setItem('bch_fail_count', failCount);
      for(let i = 0; i < 4; i++) {
        const d = document.getElementById('d' + i);
        if(d) d.style.background = 'var(--red)';
      }
      setTimeout(() => { for(let i = 0; i < 4; i++) {
        const d = document.getElementById('d' + i);
        if(d) d.style.background = ''; 
      }}, 600);

      if(failCount >= 5){
        lockUntil = Date.now() + 60000;
        failCount = 0;
        localStorage.setItem('bch_lock_until', lockUntil);
        localStorage.setItem('bch_fail_count', failCount);
        errEl.textContent = '5회 실패. 1분간 잠금됩니다.';
      } else {
        errEl.textContent = 'PIN이 틀렸습니다. (' + failCount + '/5)';
      }
    }
  } catch(e) {
    console.error(e);
    errEl.textContent = '오류가 발생했습니다.';
  }
}

/* 로그인 성공 시 화면 전환 최적화 */
function successLogin(authKey) {
  failCount = 0;
  lockUntil = 0;
  localStorage.removeItem('bch_fail_count');
  localStorage.removeItem('bch_lock_until');
  sessionStorage.setItem('bch_auth', authKey);
  
  /* 화면 전환을 먼저 수행하여 체감 속도 향상 */
  const pinScreen = document.getElementById('pin-screen');
  if(pinScreen) {
    pinScreen.style.opacity = '0';
    pinScreen.style.transition = 'opacity 0.2s ease-out';
    setTimeout(() => {
      pinScreen.classList.add('hidden');
      /* 화면이 가려진 뒤에 무거운 리스너/데이터 처리 시작 */
      initDataListener();
    }, 200);
  } else {
    initDataListener();
  }
}

/* 새로고침 시 세션 복원 — sessionStorage 키 존재 여부만으로 판단하지 않고,
   Firebase에 저장된 PIN 해시와 다시 한번 대조한 뒤에만 데이터 리스너를 시작합니다.
   화면은 우선 즉시 숨겨 체감 속도를 유지하고, 검증에 실패하면 다시 PIN 화면을 띄웁니다. */
const _savedAuth = sessionStorage.getItem('bch_auth');
if(_savedAuth){
  document.getElementById('pin-screen').classList.add('hidden');
}

async function verifySession(){
  if(!_savedAuth) return;
  try{
    await authReady;
    const snap = await db.ref(ROOT + '/auth/pin_hash').get();
    if(snap.exists() && snap.val().trim().toLowerCase().slice(0, 16) === _savedAuth){
      initDataListener();
    } else {
      /* 위조되었거나 PIN이 변경된 세션 — 즉시 로그아웃 처리 */
      sessionStorage.removeItem('bch_auth');
      document.getElementById('pin-screen').classList.remove('hidden');
    }
  } catch(e){
    console.error('세션 검증 실패:', e);
    sessionStorage.removeItem('bch_auth');
    document.getElementById('pin-screen').classList.remove('hidden');
  }
}

}
/* Firebase → 로컬 상태에 반영 */
function applyFirebaseData(data){
  if(!data)return;
  /* 내가 저장 중이면 Firebase 이전 값이 내 변경을 덮어쓰지 않도록 완전 무시 */
  if(isSavePending)return;
  if(data.txs)txs=data.txs;
  if(data.budgets)budgets=data.budgets;
  if(data.targetBudgets!==undefined){
    targetBudgets=data.targetBudgets;
    localStorage.setItem('bch_target_budgets',JSON.stringify(targetBudgets));
  } else if(data.weeklyBudgets!==undefined){
    targetBudgets=data.weeklyBudgets;
    localStorage.setItem('bch_target_budgets',JSON.stringify(targetBudgets));
  }
  if(data.weeklyAdjustments!==undefined){
    weeklyAdjustments=data.weeklyAdjustments;
    localStorage.setItem('bch_weekly_adj',JSON.stringify(weeklyAdjustments));
  } else if(data.reducedBudgets!==undefined){
    weeklyAdjustments=data.reducedBudgets.map(v=>-v);
    localStorage.setItem('bch_weekly_adj',JSON.stringify(weeklyAdjustments));
  }
  if(data.monthlyWeeklyData!==undefined){
    monthlyWeeklyData=data.monthlyWeeklyData||{};
    localStorage.setItem('bch_monthly_weekly_data',JSON.stringify(monthlyWeeklyData));
  }
  if(data.annualEvents)annualEvents=data.annualEvents;
  if(data.longSave)longSave=data.longSave;
  if(data.shortSave){
    shortSave=data.shortSave;
    if(migrateShortSaveColors()) setTimeout(saveAll, 100);
  }
  if(data.stockHoldings!==undefined)stockHoldings=data.stockHoldings||[];
  if(data.stockFx)stockFx=data.stockFx;
  if(data.fixedCustom!==undefined){
    const incoming=Array.isArray(data.fixedCustom)?data.fixedCustom:[];
    fixedCustom=incoming.map(normalizeFixedCustomItem).filter(Boolean);
    persistFixedCustom();
  }
  if(data.budgetCustom!==undefined){
    budgetCustom=normalizeBudgetCustom(data.budgetCustom);
    persistBudgetCustom();
  }
  if(data.fixedChecks)Object.entries(data.fixedChecks).forEach(([k,v])=>{
    if(k.startsWith('var_'))localStorage.setItem(k.slice(4),v);
    else localStorage.setItem(k,v);
  });
  if(data.fixedAmts)Object.entries(data.fixedAmts).forEach(([k,v])=>localStorage.setItem(k,v));
  if(data.fixedDays)Object.entries(data.fixedDays).forEach(([k,v])=>localStorage.setItem(k,v));
  if(data.fixedNames)Object.entries(data.fixedNames).forEach(([k,v])=>localStorage.setItem(k,v));
  if(data.fixedBudgetManual)localStorage.setItem('bch_fixed_budget_manual',data.fixedBudgetManual);
  if(data.monthlyBudgetManual)localStorage.setItem('bch_monthly_budget_manual',data.monthlyBudgetManual);
  if(data.theme){
    localStorage.setItem('bch_theme',data.theme);
    if(data.theme==='dark')document.body.classList.add('dark');
    else document.body.classList.remove('dark');
  }
  saveLocal();
}
function fmt(n){return Math.round(n).toLocaleString('ko-KR')+'원'}
function fmtN(n){return Math.round(n).toLocaleString('ko-KR')}
/* 사용자 입력 텍스트를 HTML에 안전하게 삽입(따옴표/태그 등으로 인한 마크업 깨짐 방지) */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtShort(n){
  const v=Math.abs(Math.round(n));
  if(v>=10000000)return(v/10000000).toFixed(1)+'천만';
  if(v>=10000)return Math.round(v/10000)+'만';
  return v.toLocaleString()+'원';
}
function p2(n){return String(n).padStart(2,'0')}
function rangeToFullDate(mStr, range){
  return `${mStr.split('-')[1]}/${p2(range.start)}~${p2(range.end)}`;
}
function todayStr(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function curMonth(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}`}
function monthlyData(){
  if(_memoMonthlyData) return _memoMonthlyData;
  const m={};
  txs.forEach(t=>{
    const k=t.date.slice(0,7);
    if(!m[k])m[k]={income:0,expense:0,expensePlanned:0,cats:{},incomeByDay:{},expByDay:{}};
    if(t.type==='income'){
      m[k].income+=t.amt;
      m[k].incomeByDay[t.date]=(m[k].incomeByDay[t.date]||0)+t.amt;
    } else if(t.type==='expense_planned'){
      m[k].expensePlanned+=t.amt;
      m[k].expense+=t.amt;
      m[k].cats[t.cat]=(m[k].cats[t.cat]||0)+t.amt;
      m[k].expByDay[t.date]=(m[k].expByDay[t.date]||0)+t.amt;
    } else {
      m[k].expense+=t.amt;
      m[k].cats[t.cat]=(m[k].cats[t.cat]||0)+t.amt;
      m[k].expByDay[t.date]=(m[k].expByDay[t.date]||0)+t.amt;
    }
  });
  _memoMonthlyData = m;
  return m;
}
function dc(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
function fixedKey(item){return item.id?`fxid_${item.id}`:`fx_${item.name}_${item.day}`;}
function isFixedHidden(item){return localStorage.getItem(fixedKey(item)+'_hidden')==='1';}
function rawFixedList(){return[...Object.values(FIXED).flat(),...fixedCustom];}
function allFixedList(){return rawFixedList().filter(i=>!isFixedHidden(i));}
function fixedGroup(item){
  if(item.group)return item.group;
  for(const [group,items] of Object.entries(FIXED))if(items.includes(item))return group;
  return '';
}
function fixedItemsByTab(tab){
  if(tab==='전체')return allFixedList();
  return allFixedList().filter(i=>fixedGroup(i)===tab);
}
function getFixedDay(item){
  const base=parseInt(item.day,10)||1;
  const v=localStorage.getItem(fixedKey(item)+'_day');
  const day=v===null?base:parseInt(v,10);
  return Number.isFinite(day)?Math.max(1,Math.min(31,day)):base;
}
function clearFixedItemStorage(key){
  ['','_amt','_day','_hidden'].forEach(s=>localStorage.removeItem(key+s));
}
function getFixedAmt(item){
  const v=localStorage.getItem(fixedKey(item)+'_amt');
  return v===null?item.amt:parseNum(v);
}
function totalVarBudget(){
  let s=0;
  for(const group of Object.keys(BUDGET_GROUPS))s+=budgetGroupItems(group).reduce((a,c)=>a+(budgets[c]||0),0);
  return s;
}
/* ⑧ 콤마 포맷 */
function formatNumInput(el){
  const s=el.value;
  const isNeg=s.includes('-') && (s.indexOf('-') < s.search(/[0-9]/) || !s.match(/[0-9]/));
  const raw=s.replace(/[^0-9]/g,'');
  const formatted=raw?parseInt(raw).toLocaleString('ko-KR'):'';
  el.value=isNeg?(raw?'-'+formatted:'-'):formatted;
}
function parseNum(val){
  const s=String(val);
  const isNeg=s.includes('-');
  const n=parseInt(s.replace(/[^0-9]/g,''))||0;
  return isNeg?-n:n;
}
function getMonthlyWeeklyData(m){
  if(!m) m=homeMonthStr();
  if(monthlyWeeklyData[m]){
    const d=monthlyWeeklyData[m];
    return {
      targetBudgets: Array.isArray(d.targetBudgets)?[...d.targetBudgets]:[0,0,0,0,0],
      weeklyAdjustments: Array.isArray(d.weeklyAdjustments)?[...d.weeklyAdjustments]:[0,0,0,0,0],
      monthlyBudgetManual: parseNum(d.monthlyBudgetManual||0)
    };
  }
  if(m===curMonth()){
    const tb=JSON.parse(localStorage.getItem('bch_target_budgets')||'[0,0,0,0,0]');
    const wa=JSON.parse(localStorage.getItem('bch_weekly_adj')||'[0,0,0,0,0]');
    const mb=parseNum(localStorage.getItem('bch_monthly_budget_manual')||'0');
    return {
      targetBudgets: tb.length?tb:[0,0,0,0,0],
      weeklyAdjustments: wa.length?wa:[0,0,0,0,0],
      monthlyBudgetManual: mb
    };
  }
  return {
    targetBudgets: [0,0,0,0,0],
    weeklyAdjustments: [0,0,0,0,0],
    monthlyBudgetManual: 0
  };
}
function setMonthlyWeeklyData(m, data){
  if(!m) m=homeMonthStr();
  monthlyWeeklyData[m]={
    targetBudgets: data.targetBudgets||[0,0,0,0,0],
    weeklyAdjustments: data.weeklyAdjustments||[0,0,0,0,0],
    monthlyBudgetManual: parseNum(data.monthlyBudgetManual||0)
  };
}
function updateWeeklyTargetBudget(idx, val){
  const m=homeMonthStr();
  const d=getMonthlyWeeklyData(m);
  d.targetBudgets[idx]=parseNum(val);
  setMonthlyWeeklyData(m, d);
  targetBudgets=d.targetBudgets;
  saveAll();
}
function updateWeeklyAdjBudget(idx, val, el){
  const m=homeMonthStr();
  const d=getMonthlyWeeklyData(m);
  const n=parseNum(val);
  d.weeklyAdjustments[idx]=n;
  if(el) el.style.color=n>=0?'var(--blue)':'var(--red)';
  setMonthlyWeeklyData(m, d);
  weeklyAdjustments=d.weeklyAdjustments;
  saveAll();
}
/* 조정액 입력칸의 숫자를 목표 예산(왼쪽)에 +/- 적용하고, 조정액은 0으로 초기화 */
function applyWeeklyAdjust(idx,sign){
  const m=homeMonthStr();
  const d=getMonthlyWeeklyData(m);
  const adjInput=document.querySelectorAll('.weekly-adj-input')[idx];
  const targetInput=document.querySelectorAll('.target-budget-input')[idx];
  if(!adjInput||!targetInput)return;
  const delta=Math.abs(parseNum(adjInput.value));
  if(!delta)return;
  d.targetBudgets[idx]=Math.max(0,(d.targetBudgets[idx]||0)+sign*delta);
  d.weeklyAdjustments[idx]=0;
  setMonthlyWeeklyData(m, d);
  targetBudgets=d.targetBudgets;
  weeklyAdjustments=d.weeklyAdjustments;
  targetInput.value=fmtN(d.targetBudgets[idx]);
  adjInput.value=fmtN(0);
  adjInput.style.color='';
  saveAll();
  renderHome();
}
/* 이번달 총 예산(수동 입력) 저장 */
function updateMonthlyBudgetManual(val){
  const m=homeMonthStr();
  const d=getMonthlyWeeklyData(m);
  d.monthlyBudgetManual=parseNum(val);
  setMonthlyWeeklyData(m, d);
  localStorage.setItem('bch_monthly_budget_manual', d.monthlyBudgetManual);
  saveAll();
  renderHome();
}

function commitActiveField(){
  const el=document.activeElement;
  if(!el)return;
  const tag=el.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'){
    try{el.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}
    try{el.blur();}catch(e){}
    if(el.dataset)delete el.dataset.dirty;
  }
}
function commitDirtyFields(){
  document.querySelectorAll('input[data-dirty=\"1\"],select[data-dirty=\"1\"],textarea[data-dirty=\"1\"]').forEach(el=>{
    try{el.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}
    try{el.blur();}catch(e){}
    if(el.dataset)delete el.dataset.dirty;
  });
}
function commitPendingFields(){
  commitActiveField();
  commitDirtyFields();
}
document.addEventListener('input',e=>{
  const el=e.target;
  if(!el||!el.tagName)return;
  const tag=el.tagName;
  if((tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')&&el.dataset)el.dataset.dirty='1';
},true);

  const el=e.target;
  if(el&&el.dataset)delete el.dataset.dirty;

function renderHome(){
  renderHomeMonthLabel();
  const m=homeMonthStr();
  const curWData=getMonthlyWeeklyData(m);
  targetBudgets=curWData.targetBudgets;
  weeklyAdjustments=curWData.weeklyAdjustments;
  const monthlyBudgetManual=curWData.monthlyBudgetManual;
  const isCurrentMonth=(m===curMonth());
  const data=monthlyData()[m]||{income:0,expense:0,cats:{}};
  document.getElementById('home-sub').textContent='';

  /* 유동 지출 잔액 계산 — 순지출(지출-수입) 기준 */
  const varBudget=totalVarBudget();
  const grossExp=data.expense;
  const monthInc=data.income||0;
  const netSpent=Math.max(0,grossExp-monthInc);   /* 수입 차감 */
  const varRemain=varBudget-netSpent;
  const varPct=varBudget>0?Math.max(0,Math.min(100,Math.round(varRemain/varBudget*100))):0;

  /* 하루 권장 금액 — 이번달일 때만 의미 있음 */
  const now=new Date();
  const lastDay=isCurrentMonth?new Date(now.getFullYear(),now.getMonth()+1,0).getDate():new Date(homeDate.getFullYear(),homeDate.getMonth()+1,0).getDate();
  const daysLeft=isCurrentMonth?Math.max(1,lastDay-now.getDate()+1):lastDay;
  const daily=Math.max(0,Math.round(varRemain/daysLeft));

  /* 고정 지출 잔액 */
  const allFixed=allFixedList();
  let fixedTotal=0,fixedDone=0;
  allFixed.forEach(i=>{
    const amt=getFixedAmt(i);
    fixedTotal+=amt;
    if(localStorage.getItem(fixedKey(i))==='true')fixedDone+=amt;
  });
  const fixedRemain=fixedTotal-fixedDone;
  const fixedPct=fixedTotal>0?Math.max(0,Math.min(100,Math.round(fixedRemain/fixedTotal*100))):0;

    </div>
    <div class="metric">
      <div class="metric-label">${isCurrentMonth?`하루 권장 금액 (${daysLeft}일 남음)`:'월간 지출 현황'}</div>
      <div class="metric-value" style="color:var(--blue)">${isCurrentMonth?fmt(daily):fmt(grossExp)}</div>
      <div class="metric-sub">${isCurrentMonth?`순지출 기준${monthInc?' (수입 차감)':''}`:monthInc?`수입 ${fmtShort(monthInc)} 포함`:m.replace('-','년 ')+'월'}</div>
    </div>
    <div class="metric">
      <div class="metric-label">고정 지출 잔액</div>
      <div class="metric-value" style="color:${fixedPct<30?'var(--green)':'var(--amber)'}">${fmt(fixedRemain)}</div>
      <div class="metric-sub">${fixedPct}% 미처리 · 총 ${fmtShort(fixedTotal)}</div>
    </div>`;

  /* 도넛 */
  const cats=data.cats;

  const total=Object.values(cats).reduce((a,b)=>a+b,0)||1;

    '생활비': '#34c759', // 에메랄드 그린
    '양육비': '#ffcc00', // 딥 오렌지
    '병원비': '#ff2d55', // 모던 루비/핑크
    '자동차': '#007aff'  // 로열 블루

      ${k} ${Math.round(cats[k]/total*100)}%
    </span>`).join('') : '<div style="color:var(--text3);padding:10px 0;">이번 달 지출 내역이 없습니다.</div>';
  dc('bar-home');

      data:{
        labels:['지출 비율'],

          label:k,

        }))
      },
      options:{
        indexAxis:'y',
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{
            enabled: false,
            external: function(context) {
              let tooltipEl = document.getElementById('bar-home-tooltip');
              if (!tooltipEl) {
                tooltipEl = document.createElement('div');
                tooltipEl.id = 'bar-home-tooltip';
                tooltipEl.style.cssText = 'position:fixed;background:rgba(30,30,30,0.92);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none;z-index:9999;white-space:nowrap;display:none;';
                document.body.appendChild(tooltipEl);
              }
              const tooltip = context.tooltip;
              if (tooltip.opacity === 0) { tooltipEl.style.display = 'none'; return; }
              const ds = tooltip.dataPoints[0];
              const label = ds.dataset.label;
              const color = ds.dataset.backgroundColor;
              const amount = fmtN(cats[label]);
              tooltipEl.innerHTML = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};margin-right:6px;vertical-align:middle"></span>${label}  ${amount}`;
              const canvasRect = context.chart.canvas.getBoundingClientRect();
              tooltipEl.style.display = 'block';
              const ttH = tooltipEl.offsetHeight;
              tooltipEl.style.left = (canvasRect.left + tooltip.caretX - tooltipEl.offsetWidth/2) + 'px';
              tooltipEl.style.top = (canvasRect.top - ttH - 8) + 'px';
            }
          }
        },
        scales:{
          x:{stacked:true,min:0,max:100,grid:{display:false},ticks:{callback:v=>v+'%',color:'#8e8e93',font:{size:10}}},
          y:{stacked:true,grid:{display:false},display:false}
        }
      }
    });});
  } else {
    chartCanvas.style.display = 'none';
  }

  /* 주간 지출 및 수입 계산 (달력 주차 기준: 월요일~일요일) */
  const [y2, mm2]=m.split('-').map(Number);
  const lastDate2=new Date(y2, mm2, 0).getDate();
  
  // 주차 범위 계산: 월요일 시작 ~ 일요일 종료
  const weekRanges=[];
  let startD=1;
  while(startD <= lastDate2){
    let endD=startD;
    const dayOfWeek=new Date(y2, mm2-1, startD).getDay(); // 0:일, 1:월 ...
    const daysUntilSun = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
    endD = Math.min(lastDate2, startD + daysUntilSun);
    weekRanges.push({start: startD, end: endD});
    startD = endD + 1;
  }

  const numWeeks = weekRanges.length;
  const weeklySpending=Array(numWeeks).fill(0), weeklyIncome=Array(numWeeks).fill(0);

  txs.forEach(t=>{
    if(t.date.startsWith(m)){
      const d=parseInt(t.date.split('-')[2]);
      const wIdx=weekRanges.findIndex(r => d >= r.start && d <= r.end);
      if(wIdx !== -1 && wIdx < numWeeks){
        if(t.type==='expense' || t.type==='expense_planned') weeklySpending[wIdx]+=t.amt;
        else weeklyIncome[wIdx]+=t.amt;
      }
    }
  });

  /* 주간 예산 편집 영역 동적 생성 */
  const editWrap = document.getElementById('weekly-budget-edit-wrap');
  if (editWrap) {
    let editHtml = `
      <div style="display:grid;grid-template-columns:32px 1fr 1.3fr;gap:10px;font-size:11px;color:var(--text3);padding-bottom:6px;border-bottom:1px solid var(--border)">
        <span>주차</span><span style="text-align:center">목표 예산</span><span style="text-align:center">조정 금액</span>
      </div>`;
    
    for (let i = 0; i < numWeeks; i++) {
      const tbVal = targetBudgets[i] || 0;
      const waVal = weeklyAdjustments[i] || 0;
      editHtml += `
        <div style="display:grid;grid-template-columns:32px 1fr 1.3fr;gap:8px;align-items:center">
          <span style="font-size:12px;font-weight:600;color:var(--text2)">${i+1}주</span>
          <input type="text" class="num-input target-budget-input" inputmode="numeric" style="padding:6px;font-size:13px;text-align:right" value="${fmtN(tbVal)}" oninput="formatNumInput(this)" onchange="updateWeeklyTargetBudget(${i},this.value)">
          <div style="display:flex;align-items:center;gap:4px">
            <input type="text" class="num-input weekly-adj-input" inputmode="numeric" style="padding:6px;font-size:13px;text-align:right;flex:1;min-width:0;color:${waVal>=0?'var(--blue)':'var(--red)'}" placeholder="0" value="${fmtN(waVal)}" oninput="formatNumInput(this)" onchange="updateWeeklyAdjBudget(${i},this.value,this)">
            <button class="btn" onclick="applyWeeklyAdjust(${i},-1)" title="목표 예산에서 빼기" style="padding:4px;min-width:26px;height:31px;flex-shrink:0;font-size:14px;font-weight:700;color:var(--red);border-color:var(--red)">−</button>
            <button class="btn" onclick="applyWeeklyAdjust(${i},1)" title="목표 예산에 더하기" style="padding:4px;min-width:26px;height:31px;flex-shrink:0;font-size:14px;font-weight:700;color:var(--blue);border-color:var(--blue)">+</button>
          </div>
        </div>`;
    }

    editHtml += `
      <div style="display:grid;grid-template-columns:32px 1fr 1.3fr;gap:8px;align-items:center;padding-top:10px;margin-top:2px;border-top:1px solid var(--border)">
        <span style="font-size:12px;font-weight:600;color:var(--text2)">총액</span>
        <input type="text" id="monthly-budget-input" class="num-input" inputmode="numeric" placeholder="이번달 총 예산" style="padding:6px;font-size:13px;text-align:right" value="${monthlyBudgetManual?fmtN(monthlyBudgetManual):''}" oninput="formatNumInput(this)" onchange="updateMonthlyBudgetManual(this.value)">
        <span id="monthly-budget-need" style="font-size:12px;font-weight:700;text-align:right;padding-right:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
      </div>`;

    editWrap.innerHTML = editHtml;
  }

  // [월간 총예산 비교] 로직 시작
  const todayD = isCurrentMonth ? new Date().getDate() : -1; /* 과거/미래달엔 이번주 하이라이트 없음 */
  let sumAvailable = 0; // 5주차 가용예산(목표+조정) 합계 — 이번달 총 예산과 비교용

  for (let i = 0; i < weekRanges.length; i++) {
    const target = targetBudgets[i] || 0;
    const adj = weeklyAdjustments[i] || 0;
    sumAvailable += (target + adj);
  }

  // 이번달 총 예산(수동 입력) 대비 조절 필요 금액 표시
  const monthlyBudgetInput = document.getElementById('monthly-budget-input');
  if (monthlyBudgetInput) monthlyBudgetInput.value = monthlyBudgetManual ? fmtN(monthlyBudgetManual) : '';
  const monthlyNeedEl = document.getElementById('monthly-budget-need');
  if (monthlyNeedEl) {
    if (!monthlyBudgetManual) {
      monthlyNeedEl.textContent = '';
    } else {
      const needDiff = monthlyBudgetManual - sumAvailable;
      if (needDiff > 0) {
        monthlyNeedEl.style.color = 'var(--blue)';
        monthlyNeedEl.textContent = `조절 필요 +${fmt(needDiff)}`;
      } else if (needDiff < 0) {
        monthlyNeedEl.style.color = 'var(--red)';
        monthlyNeedEl.textContent = `조절 필요 ${fmt(needDiff)}`;
      } else {
        monthlyNeedEl.style.color = 'var(--text3)';
        monthlyNeedEl.textContent = '✓ 예산 일치';
      }
    }
  }

  let weeklyHtml='';
  let focusHtml='';

  for (let i = 0; i < weekRanges.length; i++) {
    const spent = Math.max(0, weeklySpending[i] - weeklyIncome[i]); /* 수입 차감된 순지출 */
    const target = targetBudgets[i] || 0;
    const adj = weeklyAdjustments[i] || 0;
    const available = target + adj; // 가용 예산 = 목표 + 조정
    const remain = available - spent;
    
    let pct = 0;
    let statusText = '';
    let barCls = 'ok';
    
    if (available <= 0) {
      pct = 0;
      barCls = 'over';
      statusText = spent > 0 ? `${fmt(Math.abs(remain))} 초과` : '예산 없음';
    } else {
      if (remain < 0) {
        pct = 0;
        barCls = 'over';
        statusText = `${fmt(Math.abs(remain))} 초과`;
      } else {
        pct = Math.round(remain / available * 100);
        barCls = pct < 20 ? 'over' : pct < 50 ? 'warn' : 'ok';
        statusText = `${pct}% 남음`;
      }
    }
    
    const range = weekRanges[i] ? `${rangeToFullDate(m, weekRanges[i])}` : '';
    const isCurrentWeek = todayD >= weekRanges[i].start && todayD <= weekRanges[i].end;

    if (isCurrentWeek) {
      focusHtml = `
        <div style="background:var(--purple-light); padding:16px; border-radius:14px; border:1px solid var(--purple); margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:14px;font-weight:700;color:var(--purple-dark)">이번주 (${i+1}주차)</span>
              <span style="font-size:11px;color:var(--text3)">${range}</span>
            </div>
            <span style="font-size:14px;font-weight:700;color:${barCls==='over'?'var(--red)':barCls==='warn'?'var(--amber)':'var(--green)'}">${statusText}</span>
          </div>
          <div class="pw" style="height:8px;margin-bottom:12px;background:rgba(0,0,0,0.05)"><div class="pb ${barCls}" style="width:${Math.min(100, Math.max(0, pct))}%"></div></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <div style="font-size:10px;color:var(--text3);margin-bottom:2px">현재 지출${weeklyIncome[i]?' (수입 차감)':''}</div>
              <div style="font-size:16px;font-weight:700;color:var(--text)">${fmt(spent)}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:10px;color:var(--text3);margin-bottom:2px">남은 가용 예산</div>
              <div style="font-size:16px;font-weight:700;color:var(--purple-dark)">${fmt(Math.max(0, remain))}</div>
            </div>
          </div>
          <div class="divider" style="margin:12px 0;opacity:0.3"></div>
          <div style="font-size:11px;color:var(--text2);display:flex;justify-content:space-between">
            <span>목표 ${fmt(target)} / 조정 ${adj !== 0 ? (adj > 0 ? '+' : '-') + fmt(Math.abs(adj)) : '없음'}</span>
          </div>
          ${weeklyIncome[i]?`<div style="font-size:10px;color:var(--green);margin-top:4px">수입 ${fmt(weeklyIncome[i])} 차감 반영</div>`:''}
        </div>`;
    }

    weeklyHtml += `
      <div style="margin-bottom:14px;${isCurrentWeek?'opacity:0.5;':''}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
          <div>
            <span style="font-weight:600;color:var(--text2);font-size:12px">${i+1}주차</span>
            <span style="font-size:9px;color:var(--text3);margin-left:4px">${range}</span>
          </div>
          <span style="font-size:12px;font-weight:600;color:${remain>=0?'var(--green)':'var(--red)'}">잔여 ${fmt(Math.abs(remain))}</span>
        </div>
        <div class="pw" style="height:4px;margin-bottom:4px"><div class="pb ${barCls}" style="width:${Math.min(100,Math.max(0,pct))}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3)">
          <span>예산 ${fmt(available)} / 지출 ${fmt(spent)}${weeklyIncome[i]?' (수입차감)':''}</span>
          <span>${statusText}</span>
        </div>
      </div>`;
  }
  document.getElementById('weekly-focus-container').innerHTML = focusHtml || '<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">이번 주차 정보를 찾을 수 없습니다.</div>';
  const barsOuter=document.getElementById('weekly-bars-outer');
  if(barsOuter) barsOuter.style.display=weeklyCollapsed?'none':'block';
  const arrow=document.getElementById('weekly-collapse-arrow');
  if(arrow) arrow.style.transform=weeklyCollapsed?'rotate(-90deg)':'rotate(0deg)';
  document.getElementById('weekly-bars-container').innerHTML=weeklyHtml;

  /* 최근 거래 — 선택한 월 기준 */
  const recentTitle = document.getElementById('home-recent-title');
  if(recentTitle) recentTitle.textContent = isCurrentMonth ? '최근 거래' : `${mm2}월 거래`;
  const monthTxs = txs.filter(t=>t.date.startsWith(m));
  document.getElementById('home-recent').innerHTML=monthTxs.slice(0,6).map(t=>{
    const planned=isPlanned(t);
    const amtColor=t.type==='income'?'var(--green)':planned?'var(--amber)':'var(--red)';
    const prefix=t.type==='income'?'+':'-';
    const badge=planned?'<span style="color:var(--amber);font-weight:700;margin-right:4px">★예상</span>':'';
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);${planned?'background:var(--amber-light);border-radius:6px;padding-left:6px':''}">
      <div><div style="font-size:13px;font-weight:500">${badge}${esc(t.desc||t.cat||'—')}</div>
        <div style="font-size:11px;color:var(--text3)">${t.date}${t.cat&&t.cat!=='—'?' · '+t.cat:''}</div></div>
      <span style="font-size:13px;font-weight:700;color:${amtColor}">${prefix}${fmt(t.amt)}</span>
    </div>`;
  }).join('')||'<div style="color:var(--text3);font-size:13px;padding:20px 0;text-align:center">거래 내역이 없어요</div>';

  // Cumulative Spent Line Chart
  dc('cumulative-spent-chart');
  const cumCanvas = document.getElementById('cumulative-spent-chart');
  if(cumCanvas){
    const daysInMonth = new Date(y2, mm2, 0).getDate();
    const dailySpent = Array(daysInMonth).fill(0);
    txs.forEach(t=>{
      if(t.date.startsWith(m)){
        const d = parseInt(t.date.split('-')[2]);
        if(d >= 1 && d <= daysInMonth){
          if(t.type === 'expense' || t.type === 'expense_planned'){
            dailySpent[d - 1] += t.amt;
          }
        }
      }
    });
    const cumulativeSpent = [];
    let sum = 0;
    for(let d = 1; d <= daysInMonth; d++){
      sum += dailySpent[d - 1];
      cumulativeSpent.push(sum);
    }

    const labels = Array.from({length: cumulativeSpent.length}, (_, i) => `${mm2}.${i+1}`);
    const isDark = document.body.classList.contains('dark');
    const budgetVal = (sumAvailable > 0 ? sumAvailable : (monthlyBudgetManual > 0 ? monthlyBudgetManual : varBudget)) + monthInc;
    const todayIdx = isCurrentMonth ? Math.min(new Date().getDate(), daysInMonth) - 1 : -1;
    const todayPointRadii = cumulativeSpent.map((_, i) => i === todayIdx ? 6 : 0);
    const todayPointColors = cumulativeSpent.map((_, i) => i === todayIdx ? (isDark ? '#0a84ff' : '#007aff') : 'transparent');
    const todayPointBorder = cumulativeSpent.map((_, i) => i === todayIdx ? '#fff' : 'transparent');

    requestAnimationFrame(()=>{charts['cumulative-spent-chart'] = new Chart(cumCanvas, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: '누적 지출',
            data: cumulativeSpent,
            borderColor: isDark ? '#0a84ff' : '#007aff',
            backgroundColor: isDark ? 'rgba(10, 132, 255, 0.1)' : 'rgba(0, 122, 255, 0.08)',
            fill: true,
            borderWidth: 2.5,
            pointRadius: todayPointRadii,
            pointBackgroundColor: todayPointColors,
            pointBorderColor: todayPointBorder,
            pointBorderWidth: 2,
            tension: 0.4
          },
          {
            label: '목표 예산',
            data: Array(cumulativeSpent.length).fill(budgetVal),
            borderColor: '#ff453a',
            borderDash: [5, 5],
            fill: false,
            borderWidth: 1.5,
            pointRadius: 0
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        clip: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { label: (ctx) => ` ${fmt(ctx.parsed.y)}` },
            filter: (item) => item.datasetIndex === 0
          }
        },
        scales: {
          x: {
            ticks: {
              callback: function(value, index, values) {
                if (index === 0 || index === values.length - 1) {
                  return this.getLabelForValue(value);
                }
                return '';
              },
              autoSkip: false,
              color: '#8e8e93',
              font: { size: 10 }
            },
            grid: { display: false }
          },
          y: {
            ticks: {
              callback: v => Math.round(v/10000)+'만',
              color: '#8e8e93',
              font: { size: 10 }
            },
            beginAtZero: true,
            suggestedMax: budgetVal > 0 ? budgetVal * 1.05 : undefined,
            grid: { color: 'rgba(142,142,147,0.15)' }
          }
        }
      }
    });});
  }
}

/* ==============================
   ① 거래 입력
============================== */
function updateCats(){
  const type=document.getElementById('tx-type').value;
  const wrap=document.getElementById('cat-wrap');
  if(type==='income'){
    /* ① 수입이면 카테고리 숨김 */
    wrap.style.visibility='hidden';
  } else {
    wrap.style.visibility='visible';
    document.getElementById('tx-cat').innerHTML=EXPENSE_CATS.map(c=>`<option>${c}</option>`).join('');
  }
}
function isPlanned(t){return t.type==='expense_planned';}
function txTypeLabel(type){
  if(type==='income')return '수입';
  if(type==='expense_planned')return '지출(예상)';
  return '지출';
}
/* 거래 ID 생성 — 같은 밀리초에 여러 번 추가돼도 중복되지 않도록 보장 (삭제/수정 먹통 방지) */
let _txIdSeq=0;
function genTxId(){
  return Date.now()*1000+(_txIdSeq++%1000);
}
function addTx(){
  try{
    const date=document.getElementById('tx-date').value;
    const type=document.getElementById('tx-type').value;
    const cat=(type==='expense'||type==='expense_planned')?document.getElementById('tx-cat').value:'—';
    const desc=document.getElementById('tx-desc').value.trim();
    const amt=parseNum(document.getElementById('tx-amt').value);
    if(!date||!amt){showToast('날짜와 금액을 입력해주세요');return;}
    txs.unshift({id:genTxId(),date,type,cat,desc,amt});
    saveAll();
    document.getElementById('tx-amt').value='';
    document.getElementById('tx-desc').value='';
    renderTxList();
    renderHome();
    if(document.getElementById('page-calendar')?.classList.contains('active'))renderCalendar();
    closeTxModal();
    showToast('거래가 추가되었어요');
  }catch(e){
    console.error('addTx 오류:',e);
    showToast('거래 추가 중 오류가 발생했어요. 다시 시도해주세요');
  }
}
function clearForm(){
  document.getElementById('tx-amt').value='';
  document.getElementById('tx-desc').value='';
  document.getElementById('tx-date').value=todayStr();
}
function delTx(id){
  confirmDelete('이 거래를 삭제할까요?', ()=>{
    try{
      txs=txs.filter(t=>t.id!==id);
      saveAll();renderTxList();renderHome();
    }catch(e){
      console.error('delTx 오류:',e);
      showToast('삭제 중 오류가 발생했어요. 다시 시도해주세요');
    }
  });
}
function updateTxField(id,field,value){
  try{
    const t=txs.find(t=>t.id===id);if(!t)return;
    if(field==='amt')t.amt=parseNum(value);
    else if(field==='type'){
      const prevType=t.type;
      t.type=value;
      /* expense ↔ expense_planned 전환 시 카테고리 유지, 수입으로 바꿀 때만 초기화 */
      if(value==='income') t.cat='—';
      else if(prevType==='income') t.cat=EXPENSE_CATS[0];
      /* expense ↔ expense_planned: t.cat 그대로 */
    } else t[field]=value;
    saveAll();renderTxList();renderHome();
  }catch(e){
    console.error('updateTxField 오류:',e);
    showToast('수정 중 오류가 발생했어요. 다시 시도해주세요');
  }
}
function renderInput(){
  document.getElementById('tx-date').value=todayStr();
  updateCats();
  txListDate.setDate(1);
  renderTxMonthLabel();
  renderTxList();
}
function _renderTxEditControls(){
  const wrap=document.getElementById('tx-edit-controls');
  if(!wrap)return;
  wrap.innerHTML=txEditMode
    ?`<button class="btn btn-sm" style="background:var(--amber);color:#fff;border-color:var(--amber)" onclick="saveTxEdit()">저장</button>
      <button class="btn btn-sm" onclick="cancelTxEdit()">취소</button>`
    :`<button class="btn btn-sm" id="tx-edit-toggle" onclick="toggleTxEdit()">수정</button>`;
}
function toggleTxEdit(){
  txsBeforeEdit=JSON.parse(JSON.stringify(txs));
  txEditMode=true;
  _renderTxEditControls();
  renderTxList();
}
function saveTxEdit(){
  commitPendingFields();
  txEditMode=false;
  txsBeforeEdit=null;
  saveAll();
  _renderTxEditControls();
  renderTxList();
}
function cancelTxEdit(){
  if(txsBeforeEdit){
    txs=JSON.parse(JSON.stringify(txsBeforeEdit));
    txsBeforeEdit=null;
  }
  txEditMode=false;
  _renderTxEditControls();
  renderTxList();
  renderHome();
}
function renderTxList(){
  const mf=txMonthKey();
  renderTxMonthLabel();
  const tf=document.getElementById('filter-type').value;
  const list=txs.filter(t=>(!mf||t.date.startsWith(mf))&&(!tf||t.type===tf))
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id); /* 날짜 내림차순(최신 날짜 먼저), 같은 날짜면 최근 추가한 항목 먼저 */
  /* 지출(예상) 배지 헬퍼 - 주황색 원형 뱃지 없이 일반 텍스트에 색상만 강조 */
  const plannedBadge='<span style="color:var(--amber);font-weight:700;margin-right:4px">★예상)</span>';
  const isMobile=window.innerWidth<=768;
  const headRow=document.querySelector('#page-input table thead tr');
  if(isMobile){
    if(headRow)headRow.innerHTML='';
    document.getElementById('tx-tbody').innerHTML='';
    const wrap=document.getElementById('tx-card-list');
    if(!wrap)return;
    if(!list.length){
      wrap.innerHTML='<div style="text-align:center;padding:30px;color:var(--text3)">거래 내역이 없어요</div>';
      return;
    }
    if(!txEditMode){

        <td><button class="btn-ghost" onclick="delTx(${t.id})">&#10005;</button></td>

    }).join('');
  }
}

/* ==============================
   ② 소비 캘린더
============================== */
function renderCalendar(){
  const y=calDate.getFullYear(),mo=calDate.getMonth();
  const mStr=`${y}-${p2(mo+1)}`;
  document.getElementById('cal-label').textContent=`${y}년 ${mo+1}월`;

  /* 잔액 요약 — 순지출 = 지출 - 수입 */
  const varBudget=totalVarBudget();
  const monthData=monthlyData()[mStr]||{expense:0,income:0,cats:{}};
  const grossExp=monthData.expense;
  const monthInc=monthData.income||0;
  const netSpent=Math.max(0,grossExp-monthInc);
  const varRemain=varBudget-netSpent;
  const varPct=varBudget>0?Math.max(0,Math.min(100,Math.round(varRemain/varBudget*100))):0;
  const barCls=varPct<20?'over':varPct<50?'warn':'ok';
  document.getElementById('cal-summary').innerHTML=`
    <div class="g3" style="margin-bottom:6px">
      <div class="metric"><div class="metric-label">유동 지출 예산</div><div class="metric-value">${fmt(varBudget)}</div></div>
      <div class="metric">
        <div class="metric-label">이번 달 사용 (순지출)</div>
        <div class="metric-value" style="color:var(--red)">${fmt(netSpent)}</div>
        <div class="metric-sub">지출 ${fmt(grossExp)}${monthInc?` − 수입 ${fmt(monthInc)}`:''}</div>
      </div>
      <div class="metric"><div class="metric-label">예산 잔여 금액</div>
        <div class="metric-value" style="color:#007aff">${fmt(varRemain)}</div>
        <div class="metric-sub">${varPct}% 남음</div></div>
    </div>
    <div class="pw" style="height:9px;margin-bottom:8px"><div class="pb ${barCls}" style="width:${varPct}%"></div></div>`;

  /* 캘린더 */
  const today=new Date();
  const firstDay=new Date(y,mo,1).getDay();
  const lastDate=new Date(y,mo+1,0).getDate();
  const md=monthlyData()[mStr]||{expByDay:{},incomeByDay:{}};

  let html=['일','월','화','수','목','금','토'].map(d=>`<div class="cal-hd">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++)html+=`<div class="cal-cell cal-empty"></div>`;
  for(let d=1;d<=lastDate;d++){
    const ds=`${mStr}-${p2(d)}`;
    const dow=new Date(y,mo,d).getDay();
    const isT=today.getFullYear()===y&&today.getMonth()===mo&&today.getDate()===d;
    const exp=md.expByDay[ds],inc=md.incomeByDay?md.incomeByDay[ds]:0;
    html+=`<div class="cal-cell${isT?' cal-today':''}">
      <div class="cal-day${dow===0?' sun':dow===6?' sat':''}">${d}</div>
      ${inc?`<div class="cal-inc">+${fmtShort(inc)}</div>`:''}
      ${exp?`<div class="cal-exp">-${fmtShort(exp)}</div>`:''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
  renderCalEvents();
}
/* ② 전체 수정 가능, 이번달 강조 */
function renderCalEvents(){
  const el=document.getElementById('cal-events');
  const nowMo=p2(calDate.getMonth()+1);
  const thisMonthEvent=annualEvents.find(e=>e.month===nowMo);
  if(calEditMode){
    el.innerHTML=`<div style="font-size:12px;color:var(--text3);margin-bottom:10px">각 월 일정을 직접 수정할 수 있어요</div>`+
      annualEvents.map(e=>`
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
          <span style="min-width:28px;font-size:13px;font-weight:600;color:${e.month===nowMo?'var(--purple-dark)':'var(--text3)'}">${e.month}월</span>
          <input type="text" value="${e.text}" onchange="updateAnnualEvent('${e.month}',this.value)"
            style="flex:1;font-size:13px;padding:6px 10px;${e.month===nowMo?'border-color:var(--purple);':''}">
        </div>`).join('');
  } else {
    /* 이번달 일정 상단 강조 박스 */
    const curHighlight=thisMonthEvent?`
      <div style="background:var(--purple-light);border-left:4px solid var(--purple);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:14px">
        <div style="font-size:11px;font-weight:600;color:var(--purple-dark);margin-bottom:4px">${nowMo}월 이번 달 주요 일정</div>
        <div style="font-size:14px;color:var(--text);line-height:1.6">${thisMonthEvent.text}</div>
      </div>`:'';
    el.innerHTML=curHighlight+annualEvents.map(e=>`
      <div style="display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;${e.month===nowMo?'background:var(--purple-light);margin:0 -4px;padding:7px 4px;border-radius:6px;':''}">
        <span style="min-width:28px;font-weight:700;color:${e.month===nowMo?'var(--purple-dark)':'var(--text3)'}">${e.month}월</span>
        <span style="color:${e.month===nowMo?'var(--text)':'var(--text2)'};${e.month===nowMo?'font-weight:500':''}">${e.text}</span>
      </div>`).join('');
  }
}
function toggleCalEdit(){
  calEditMode=!calEditMode;
  const calBtn=document.getElementById('cal-edit-btn');
  if(calBtn){
    calBtn.textContent=calEditMode?'완료':'수정';
    calBtn.style.background=calEditMode?'var(--amber)':'';
    calBtn.style.color=calEditMode?'#fff':'';
    calBtn.style.borderColor=calEditMode?'var(--amber)':'';
  }
  if(!calEditMode)saveAll();
  renderCalEvents();
}
function updateAnnualEvent(mo,val){
  const idx=annualEvents.findIndex(e=>e.month===mo);
  if(idx>=0)annualEvents[idx].text=val;
}
function calPrev(){calDate.setMonth(calDate.getMonth()-1);renderCalendar();}
function calNext(){calDate.setMonth(calDate.getMonth()+1);renderCalendar();}
function txMonthKey(){return`${txListDate.getFullYear()}-${p2(txListDate.getMonth()+1)}`;}
function renderTxMonthLabel(){
  const el=document.getElementById('tx-month-label');
  if(!el)return;
  el.textContent=`${txListDate.getFullYear()}년 ${txListDate.getMonth()+1}월`;
}
function txPrevMonth(){txListDate.setDate(1);txListDate.setMonth(txListDate.getMonth()-1);renderTxList();}
function txNextMonth(){txListDate.setDate(1);txListDate.setMonth(txListDate.getMonth()+1);renderTxList();}

/* ==============================
   ③ 예산 관리
============================== */
let budgetsBeforeEdit = null;
function renderBudget(){
  const mStr=curMonth();
  const monthData=monthlyData()[mStr]||{cats:{}};

  let totalIncome=0,totalSaving=0;
  budgetIncomeItems().forEach(c=>totalIncome+=(budgets[c]||0));
  budgetSavingItems().forEach(c=>totalSaving+=(budgets[c]||0));
  /* ③ 유동 지출 예산 = 지출 예산 설정 합산 */
  const varB=totalVarBudget();
  const fixedB=parseInt(localStorage.getItem('bch_fixed_budget_manual'))||allFixedList().reduce((s,i)=>s+getFixedAmt(i),0);
  const realIncome=totalIncome-totalSaving;
  const totalExp=varB+fixedB;
  const remaining=realIncome-totalExp;

  const now=new Date();
  const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const daysLeft=Math.max(1,lastDay-now.getDate()+1);
  /* ⑥ 거래 내역의 실제 지출/수입 */
  const actualExp=Object.values(monthData.cats).reduce((s,v)=>s+v,0); /* 지출 합 */
  const actualInc=monthData.income||0; /* 수입 합 */
  const netSpentBudget=Math.max(0,actualExp-actualInc); /* 순지출 */
  const varRemain=varB-netSpentBudget;
  const daily=Math.max(0,Math.round(varRemain/daysLeft));

  const summaryHtml=`
    <div class="budget-summary-grid">
      <div class="card" style="margin-bottom:0;text-align:center;border-top:3px solid var(--green)">
        <div style="font-size:11px;color:var(--text3)">가용 수입</div>
        <div class="budget-summary-amount" style="color:var(--green)">${fmt(realIncome)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px">총수입 − 적금·청약</div>
      </div>
      <div class="card" style="margin-bottom:0;text-align:center;border-top:3px solid var(--red)">
        <div style="font-size:11px;color:var(--text3)">예정 지출 합계</div>
        <div class="budget-summary-amount" style="color:var(--red)">${fmt(totalExp)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px">유동 + 고정</div>
      </div>
      <div class="card" style="margin-bottom:0;text-align:center;border-top:3px solid var(--purple)">
        <div style="font-size:11px;color:var(--text3)">이달 예상 저축</div>
        <div class="budget-summary-amount" style="color:${remaining>=0?'var(--purple-dark)':'var(--red)'}">${fmt(remaining)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px">가용 수입 − 예정 지출</div>
      </div>
    </div>`;

  /* Col1 수입/적금 */
  const incomeItems=budgetIncomeItems();
  const savingItems=budgetSavingItems();
  let col1=`<div class="card" style="margin-bottom:0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div class="card-title" style="font-size:14px;margin-bottom:0">수입</div>
