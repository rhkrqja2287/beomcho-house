        style="width:100%;text-align:right;padding:6px 2px 6px 8px;font-size:13px">
      <span class="budget-unit">원</span>
      <button class="fixed-del-btn budget-del-btn" onclick="removeBudgetIncomeItem('${escJs(cat)}')" title="remove" aria-label="remove">X</button>
    </div>`;
  });
  col1+=`<div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">

function _budgetRename(oldName,newName){
  /* 금액 이전 */
  if(budgets[oldName]!==undefined){budgets[newName]=budgets[oldName];delete budgets[oldName];}
}
function renameBudgetIncome(oldName,newName){
  if(!newName.trim()||newName===oldName)return;
  const idx=(budgetCustom.incomeCustom||[]).indexOf(oldName);
  if(idx>=0){budgetCustom.incomeCustom[idx]=newName;}
  else{
    if(!budgetCustom.renamedIncome)budgetCustom.renamedIncome={};
    const orig=Object.keys(budgetCustom.renamedIncome).find(k=>budgetCustom.renamedIncome[k]===oldName)||oldName;
    budgetCustom.renamedIncome[orig]=newName;
  }
  _budgetRename(oldName,newName);
  persistBudgetCustom();
  if(!budgetEditMode) renderBudget();
}
function renameBudgetSaving(oldName,newName){
  if(!newName.trim()||newName===oldName)return;
  const idx=(budgetCustom.savingCustom||[]).indexOf(oldName);
  if(idx>=0){budgetCustom.savingCustom[idx]=newName;}
  else{
    if(!budgetCustom.renamedSaving)budgetCustom.renamedSaving={};
    const orig=Object.keys(budgetCustom.renamedSaving).find(k=>budgetCustom.renamedSaving[k]===oldName)||oldName;
    budgetCustom.renamedSaving[orig]=newName;
  }
  _budgetRename(oldName,newName);
  persistBudgetCustom();
  if(!budgetEditMode) renderBudget();
}
function renameBudgetGroup(group,oldName,newName){
  if(!newName.trim()||newName===oldName)return;
  if(!budgetCustom.groupCustom)budgetCustom.groupCustom={};
  const idx=(budgetCustom.groupCustom[group]||[]).indexOf(oldName);
  if(idx>=0){budgetCustom.groupCustom[group][idx]=newName;}
  else{
    if(!budgetCustom.renamedGroups)budgetCustom.renamedGroups={};
    if(!budgetCustom.renamedGroups[group])budgetCustom.renamedGroups[group]={};
    const orig=Object.keys(budgetCustom.renamedGroups[group]).find(k=>budgetCustom.renamedGroups[group][k]===oldName)||oldName;
    budgetCustom.renamedGroups[group][orig]=newName;
  }
  _budgetRename(oldName,newName);
  persistBudgetCustom();
  if(!budgetEditMode) renderBudget();
}

  const groupEl=document.getElementById('fixed-new-group');
  if(!nameEl||!amtEl||!dayEl||!groupEl)return;

  const name=nameEl.value.trim();

function removeFixedItem(key){
  if(!window.confirm('이 항목을 삭제할까요?'))return;
  const idx=fixedCustom.findIndex(i=>fixedKey(i)===key);
  if(idx>=0){
    const removed=fixedCustom[idx];
    fixedCustom.splice(idx,1);
    persistFixedCustom();
    clearFixedItemStorage(key);
    localStorage.removeItem(varCheckKey(key,removed.name));

  LONG_ORDER.forEach(k=>{if(longSave[k])longSaveOrdered[k]=longSave[k];});
  Object.keys(longSave).forEach(k=>{if(!longSaveOrdered[k])longSaveOrdered[k]=longSave[k];});
  const longTotal=Object.values(longSave).reduce((s,v)=>s+v.bal,0);
  /* 이번달 장기 저축 누계 */
  const longMKey='savedThisMonth_'+curMonth();
  let longThisMonth=0;
  Object.values(longSaveOrdered).forEach(v=>{longThisMonth+=(v[longMKey]||0);});
  html+=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${longThisMonth!==0?'8px':'14px'}">

      <span style="font-size:14px;font-weight:700;color:var(--blue)">${fmt(longTotal)}</span>

    ${longThisMonth!==0?`<div style="background:var(--blue-light);border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">

          <div style="display:flex;align-items:center;gap:2px">
            <span style="font-size:9px;color:var(--text3)">월저축</span>
            <input type="text" value="${fmtN(v.monthly)}" oninput="formatNumInput(this)" inputmode="numeric" onchange="updateSave('long','${name}','monthly',this.value)" style="width:60px;text-align:right;border:1px solid var(--border);border-radius:6px;font-size:10px;color:var(--green);padding:2px 3px">
          </div>
          <div style="display:flex;gap:2px">
            <button class="btn btn-sm" onclick="addSave('long','${name}',1)" style="padding:1px 5px;font-size:9px">+</button>
            <button class="btn btn-sm" onclick="addSave('long','${name}',-1)" style="padding:1px 5px;font-size:9px">−</button>

        </div>
      </div>
    </li>`;
  }  html+=`</ul></div>`;

  /* 단기 저축 */
  /* 보유 미국 ETF 기반 자동 계산 (환율/시세 반영) — shortTotal 계산 전에 '주식' 보유액 동기화 */
  const fxRate=stockFx.rate||1380;
  const holdingsCalc=stockHoldings.map(h=>{
    const shares=h.shares||0, price=h.price||0, yieldPct=h.yieldPct||0;
    const valueUSD=shares*price;
    const valueKRW=Math.round(valueUSD*fxRate);
    const monthlyDivKRW=Math.round(valueUSD*(yieldPct/100)/12*fxRate*0.85); /* 미국 원천징수 15% 가정 */
    return{...h,valueUSD,valueKRW,monthlyDivKRW};
  });
  const hasHoldings=stockHoldings.length>0;
  const holdingsTotalKRW=holdingsCalc.reduce((s,h)=>s+h.valueKRW,0);
  const holdingsMonthlyDiv=holdingsCalc.reduce((s,h)=>s+h.monthlyDivKRW,0);
  if(hasHoldings && shortSave['주식']){
    shortSave['주식'].bal=holdingsTotalKRW;
    localStorage.setItem('bch_short_save',JSON.stringify(shortSave));
  }
  const sVals=Object.values(shortSave);
  const shortTotal=sVals.reduce((s,v)=>s+v.bal,0);
  const shortMKey='savedThisMonth_'+curMonth();
  let shortThisMonth=0;
  sVals.forEach(v=>{shortThisMonth+=(v[shortMKey]||0);});
  /* 주식 배당 계산: 보유 ETF가 있으면 실제 종목별 배당수익률 기반, 없으면 기존 추정치 사용 */
  const stockBal=shortSave['주식']?.bal||0;
  const dividend=hasHoldings?holdingsMonthlyDiv:Math.round(stockBal*0.11456/12*0.846/10000)*10000;

  /* 투자 비율 도넛 */
  const shortNames=Object.keys(shortSave);
  const APPLE_COLORS=['#0040a1','#82d7ff','#34c759','#ff453a','#af52de','#ff2d55','#ffcc00','#5ac8fa'];
  const shortColors=shortNames.map((n,i)=>shortSave[n].color || APPLE_COLORS[i%APPLE_COLORS.length]);

  html+=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${shortThisMonth!==0?'8px':'14px'}">
      <div class="card-title" style="margin-bottom:0">단기 저축</div>
      <div style="text-align:right">
        <div style="font-size:14px;font-weight:700;color:var(--teal)">${fmt(Math.round(shortTotal/10000)*10000)}</div>
        <div style="font-size:11px;color:var(--text3)">월 주식 배당 예상 약 ${Math.round(dividend/10000)}만원</div>
      </div>
    </div>
    ${shortThisMonth!==0?`<div style="background:var(--teal-light);border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;color:var(--teal)">이번달 저축 누계</span>
      <span style="font-size:14px;font-weight:700;color:${shortThisMonth>=0?'var(--green)':'var(--red)'}">${shortThisMonth>=0?'+':''}${fmt(shortThisMonth)}</span>
    </div>`:''}
    <div style="display:grid;grid-template-columns:1fr 200px;gap:20px;align-items:start" class="save-grid">
      <ul class="fl">`;
  Object.entries(shortSave).forEach(([name,v],si)=>{
    const itemColor=v.color || APPLE_COLORS[si%APPLE_COLORS.length];
    const pct=shortTotal>0?Math.round(v.bal/shortTotal*100):0;
    /* '주식' 항목은 ETF 자동환산 시 만원 단위로 반올림해 표기 (정확한 원 단위는 보유 ETF 카드에서 확인) */
    const displayBal=(name==='주식'&&hasHoldings)?Math.round(v.bal/10000)*10000:v.bal;
    html+=`<li class="fi save-li">
      <div class="save-li-inner">
        <div class="save-li-main" style="flex:1">
          <span class="pct-dot" style="background:${itemColor}"></span>
          <div class="save-li-main"><span class="save-li-name">${name}</span></div>
          <span style="font-size:9px;color:var(--text3);white-space:nowrap">${pct}%</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;white-space:nowrap;margin-left:auto">
          <div style="display:flex;align-items:center;gap:2px">
            <span style="font-size:9px;color:var(--text3)">보유액</span>
            <input type="text" value="${fmtN(displayBal)}" oninput="formatNumInput(this)" inputmode="numeric" onchange="updateSave('short','${name}','bal',this.value)" style="width:65px;text-align:right;border:1px solid var(--border);border-radius:6px;font-size:10px;font-weight:700;color:${itemColor};padding:2px 3px">
          </div>
          <div style="display:flex;align-items:center;gap:2px">
            <span style="font-size:9px;color:var(--text3)">월저축</span>
            <input type="text" value="${fmtN(v.monthly)}" oninput="formatNumInput(this)" inputmode="numeric" onchange="updateSave('short','${name}','monthly',this.value)" style="width:55px;text-align:right;border:1px solid var(--border);border-radius:6px;font-size:10px;color:var(--green);padding:2px 3px">
          </div>
          <div style="display:flex;gap:2px">
            <button class="btn btn-sm" onclick="addSave('short','${name}',1)" style="padding:1px 5px;font-size:9px">+</button>
            <button class="btn btn-sm" onclick="addSave('short','${name}',-1)" style="padding:1px 5px;font-size:9px">−</button>
          </div>
        </div>
      </div>
    </li>`;
  });
  html+=`</ul>
      <div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:8px;text-align:center">투자 비율</div>
        <div style="position:relative;height:160px"><canvas id="save-donut" role="img" aria-label="단기 저축 투자 비율">투자비율</canvas></div>
        <div style="margin-top:10px">
          ${shortNames.map((n,li)=>{
            const pct=shortTotal>0?Math.round(shortSave[n].bal/shortTotal*100):0;
            const itemColor=shortSave[n].color || APPLE_COLORS[li%APPLE_COLORS.length];
            return`<div style="display:flex;align-items:center;gap:5px;font-size:11px;margin-bottom:3px">
              <span class="pct-dot" style="background:${itemColor}"></span>
              <span style="color:var(--text2)">${n}</span>
              <span style="margin-left:auto;font-weight:600">${pct}%</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">월별 저축 추이</div>
    <div style="position:relative;height:200px"><canvas id="save-trend" role="img" aria-label="월별 저축 추이">저축 추이</canvas></div>
  </div>`;

  let timeStr = '미조회';
  if(stockFx.updated){
    const uD = new Date(stockFx.updated);
    timeStr = `${p2(uD.getMonth()+1)}.${p2(uD.getDate())} ${p2(uD.getHours())}:${p2(uD.getMinutes())}`;
  }

  html+=`
  <div class="card">
    <div class="etf-head">
      <div class="etf-head-left" onclick="toggleEtfCollapse()">
        <span style="font-size:16px;color:var(--text2);transition:transform .2s;display:inline-block;transform:rotate(${etfCardCollapsed?'-90deg':'0deg'})">▾</span>
        <div class="card-title" style="margin-bottom:0">보유 미국 ETF${hasHoldings?` <span style="font-size:11px;font-weight:400;color:var(--text3)">(${stockHoldings.length}종목/${timeStr})</span>`:''}</div>
      </div>
      <div class="etf-head-right">
        <div class="save-li-actions" style="margin-right:4px">
          <button class="btn btn-sm" onclick="addStockHolding()" style="font-size:11px">+ 종목 추가</button>
        </div>
        <button class="btn btn-sm" id="stock-refresh-btn" onclick="refreshStockPrices()" style="font-size:11px" title="새로고침">새로고침</button>
      </div>
    </div>
    ${etfCardCollapsed?'':`
    <div class="etf-grid">
      ${holdingsCalc.map((h,idx)=>`<div class="etf-card" style="position:relative">
        <div class="save-li-actions" style="position:absolute;top:4px;right:6px">
          <button class="btn-ghost" onclick="removeStockHolding(${idx})" style="font-size:14px;padding:2px;color:var(--text3);line-height:1" title="종목 삭제">×</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;align-items:end">
          <div class="etf-field">
            <label>티커</label>
            <input type="text" class="etf-ticker-input" value="${h.ticker||''}" placeholder="티커" onchange="updateStockHolding(${idx},'ticker',this.value)" style="width:100%">
          </div>
          <div class="etf-field">
            <label>수량</label>
            <input type="text" value="${h.shares||0}" inputmode="decimal" onchange="updateStockHolding(${idx},'shares',this.value)">
          </div>
        </div>
        <div class="etf-price-row">
          <div class="etf-field">
            <label>현재가 $</label>
            <input type="text" value="${h.price||0}" inputmode="decimal" onchange="updateStockHolding(${idx},'price',this.value)">
          </div>
          <div class="etf-field">
            <label>배당 %</label>
            <input type="text" value="${h.yieldPct||0}" inputmode="decimal" onchange="updateStockHolding(${idx},'yieldPct',this.value)">
          </div>
        </div>
        <div class="etf-result">
          <div class="etf-result-item">
            <div class="etf-result-label">평가액</div>
            <div class="etf-result-value">${fmt(h.valueKRW)}</div>
          </div>
          <div class="etf-result-item div">
            <div class="etf-result-label">월배당</div>
            <div class="etf-result-value">${fmt(h.monthlyDivKRW)}</div>
          </div>
        </div>
        ${h.lastError === 'manual' ? '<div class="etf-err" style="color:var(--text3)">✓ 수동 입력 완료</div>' : h.lastError ? '<div class="etf-err">⚠ 시세 조회 실패 — 직접 입력</div>' : ''}
      </div>`).join('')}
    </div>
    <div class="etf-footer">
      <div style="display:flex;align-items:center;gap:4px">
        <span style="font-size:11px;color:var(--text3)">₩</span>
        <input type="text" id="fx-rate-input" class="etf-fx-input" value="${Math.round(fxRate).toLocaleString('ko-KR')}" inputmode="numeric" oninput="formatNumInput(this)" onchange="updateFxRate(this.value)" title="환율(₩/$)">
        <span style="font-size:11px;color:var(--text3)">/$</span>
      </div>
      ${hasHoldings?`<div class="etf-total">
        <span>합계 <b>${fmt(holdingsTotalKRW)}</b></span>
        <span>월배당 <b style="color:var(--green)">${fmt(holdingsMonthlyDiv)}</b></span>
      </div>`:''}
    </div>
    `}
  </div>`;

  document.getElementById('save-content').innerHTML=html;

  /* 도넛 차트 */
  dc('save-donut');
  if(shortTotal>0)charts['save-donut']=new Chart(document.getElementById('save-donut'),{
    type:'doughnut',
    data:{labels:shortNames,datasets:[{data:shortNames.map(n=>shortSave[n].bal),backgroundColor:shortColors,borderWidth:2,borderColor:'transparent'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'60%'}
  });

  /* 월별 저축 추이 — 거래 내역 + 저축 +/- 기록 모두 반영, 데이터 없어도 표시 */
  const monthly=monthlyData();
  /* 최근 6개월 라벨 생성 (거래 없어도 표시) */
  const trendLabels=[];
  for(let i=5;i>=0;i--){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    trendLabels.push(`${d.getFullYear()}-${p2(d.getMonth()+1)}`);
  }
  const saveTrend=trendLabels.map(m=>{
    /* 거래 내역 기반 + 저축 +/- 누계 모두 합산 */
    const md=monthly[m];
    let base=md?Math.max(0,md.income-md.expense):0;
    /* longSave/shortSave의 thisMonth 누계도 더하기 */
    const mk='savedThisMonth_'+m;
    Object.values(longSave).forEach(v=>{if(v[mk])base+=(v[mk]||0);});
    Object.values(shortSave).forEach(v=>{if(v[mk])base+=(v[mk]||0);});
    return base;
  });
  dc('save-trend');
  const trendCanvas=document.getElementById('save-trend');
  const trendCtx=trendCanvas.getContext('2d');
  const isDark=document.documentElement.classList.contains('dark')||window.matchMedia('(prefers-color-scheme:dark)').matches;
  const accentColor=isDark?'#0a84ff':'#007aff';
  const trendFill=trendCtx.createLinearGradient(0,0,0,200);
  trendFill.addColorStop(0,isDark?'rgba(10,132,255,0.3)':'rgba(0,122,255,0.2)');
  trendFill.addColorStop(1,'rgba(0,122,255,0.0)');
  charts['save-trend']=new Chart(document.getElementById('save-trend'),{
    type:'line',
    data:{
      labels:trendLabels,
      datasets:[{
        label:'월 저축액',
        data:saveTrend,
        borderColor:accentColor,
        backgroundColor:trendFill,
        borderWidth:2.5,
        tension:0.4,
        fill:true,
        pointRadius:4,
        pointHoverRadius:6,
        pointBackgroundColor:'#ffffff',
        pointBorderColor:accentColor,
        pointBorderWidth:2
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>` ${fmt(ctx.parsed.y)}`}}},
      scales:{
        x:{ticks:{autoSkip:false,maxRotation:35,minRotation:35,color:'#8e8e93'},grid:{display:false}},
        y:{ticks:{callback:v=>Math.round(v/10000)+'만',color:'#8e8e93'},beginAtZero:true,grid:{color:'rgba(142,142,147,0.15)'}}
      }
    }
  });

  /* 저축 렌더 후 헤더 버튼 업데이트 */
  const header = document.querySelector('#page-savings > div:first-child');
  if (header) {
    header.className = 'page-header-wrap';
    if (savingsEditMode) {
      header.innerHTML = `
        <div class="page-title" style="margin-bottom:0">저축 금액</div>
        <div class="page-header-right">
          <button class="btn btn-sm" style="background:var(--amber);color:#fff;border-color:var(--amber)" onclick="saveSavingsEdit()">저장</button>
          <button class="btn btn-sm" onclick="cancelSavingsEdit()">취소</button>
        </div>`;
    } else {
      header.innerHTML = `
        <div class="page-title" style="margin-bottom:0">저축 금액</div>
        <div class="page-header-right">
          <button class="btn btn-sm" id="savings-edit-toggle" onclick="toggleSavingsEdit()">수정</button>
        </div>`;
    }
  }
  _restoreSavingsLock();
}
let savingsBeforeEdit = null;
function saveSavingsEdit(){
  commitPendingFields();
  savingsEditMode=false;
  savingsBeforeEdit=null;
  saveAll();
  renderSavings();
}
function cancelSavingsEdit(){
  if(savingsBeforeEdit){
    longSave = JSON.parse(JSON.stringify(savingsBeforeEdit.long));
    shortSave = JSON.parse(JSON.stringify(savingsBeforeEdit.short));
    stockHoldings = JSON.parse(JSON.stringify(savingsBeforeEdit.stock));
    savingsBeforeEdit=null;
  }
  savingsEditMode=false;
  saveLocal();
  renderSavings();
}
function toggleSavingsEdit(){
  savingsBeforeEdit = {
    long: JSON.parse(JSON.stringify(longSave)),
    short: JSON.parse(JSON.stringify(shortSave)),
    stock: JSON.parse(JSON.stringify(stockHoldings))
  };
  savingsEditMode=true;
  renderSavings();
}
function _restoreSavingsLock(){
  const pg=document.getElementById('page-savings');
  if(!pg)return;
  pg.classList.toggle('savings-edit-on', savingsEditMode);
  pg.querySelectorAll('input').forEach(el=>{
    el.readOnly=!savingsEditMode;
    el.tabIndex=savingsEditMode?0:-1;
  });
}
function updateSave(group,name,field,val){
  const store=group==='long'?longSave:shortSave;
  if(!store[name])return;
  store[name][field]=parseNum(val);
  saveAll();
}
/* ===== 보유 미국 ETF 관리 ===== */
function toggleWeeklyCollapse(){
  weeklyCollapsed=!weeklyCollapsed;
  localStorage.setItem('bch_weekly_collapsed',JSON.stringify(weeklyCollapsed));
  const barsOuter=document.getElementById('weekly-bars-outer');
  if(barsOuter) barsOuter.style.display=weeklyCollapsed?'none':'block';
  const arrow=document.getElementById('weekly-collapse-arrow');
  if(arrow) arrow.style.transform=weeklyCollapsed?'rotate(-90deg)':'rotate(0deg)';
}
function toggleEtfCollapse(){
  etfCardCollapsed=!etfCardCollapsed;
  localStorage.setItem('bch_etf_collapsed',JSON.stringify(etfCardCollapsed));
  renderSavings();_restoreSavingsLock();
}
function updateFxRate(val){
  const n=parseNum(val);
  if(n>0){stockFx.rate=n;stockFx.updated=Date.now();saveLocal();renderSavings();_restoreSavingsLock();}
}
function parseDecimal(val){
  const n=parseFloat(String(val).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
function addStockHolding(){
  stockHoldings.push({ticker:'',shares:0,price:0,yieldPct:0});
  saveAll();renderSavings();_restoreSavingsLock();
}
function removeStockHolding(idx){
  if(!stockHoldings[idx])return;
  stockHoldings.splice(idx,1);
  saveAll();renderSavings();_restoreSavingsLock();
}
function updateStockHolding(idx,field,val){
  if(!stockHoldings[idx])return;
  if(field==='ticker')stockHoldings[idx].ticker=String(val).trim().toUpperCase();
  else stockHoldings[idx][field]=parseDecimal(val);
  if(field==='price'){
    stockHoldings[idx].lastError='manual';
  }
  saveAll();renderSavings();_restoreSavingsLock();
}
function adjustStockShares(idx,delta){
  if(!stockHoldings[idx])return;
  const cur=stockHoldings[idx].shares||0;
  stockHoldings[idx].shares=Math.max(0,Math.round((cur+delta)*10000)/10000);
  saveAll();renderSavings();_restoreSavingsLock();
}
/* 환율(무료 API) + 종목 시세·배당수익률(야후 파이낸스, CORS 프록시 경유) 자동 조회 */
async function refreshStockPrices(){
  const btn=document.getElementById('stock-refresh-btn');
  if(btn){btn.disabled=true;btn.textContent='갱신 중...';}
  let failN=0;
  try{
    try{
      const fxRes=await fetch('https://open.er-api.com/v6/latest/USD');
      const fxData=await fxRes.json();
      if(fxData && fxData.rates && fxData.rates.KRW){
        stockFx={rate:fxData.rates.KRW,updated:Date.now()};
      }
    }catch(e){console.warn('환율 조회 실패',e);}

    for(const h of stockHoldings){
      h.lastError=false;
      if(!h.ticker)continue;
      const sym=encodeURIComponent(h.ticker.trim().toUpperCase());
      try{
        const url=`https://query1.finance.yahoo.com/v8/finance/chart/${sym}`;
        const res=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
        const data=await res.json();
        const price=data?.chart?.result?.[0]?.meta?.regularMarketPrice;
        if(price)h.price=price;else{h.lastError=true;failN++;}
      }catch(e){console.warn(h.ticker+' 시세 조회 실패',e);h.lastError=true;failN++;}
      try{
        const qUrl=`https://query2.finance.yahoo.com/v10/finance/quoteSummary/${sym}?modules=summaryDetail`;
        const qRes=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(qUrl)}`);
        const qData=await qRes.json();
        const dy=qData?.quoteSummary?.result?.[0]?.summaryDetail?.dividendYield?.raw;
        if(dy)h.yieldPct=Math.round(dy*10000)/100;
      }catch(e){console.warn(h.ticker+' 배당수익률 조회 실패',e);}
    }
    saveAll();
    renderSavings();_restoreSavingsLock();
    if(failN>0) showToast(`갱신 완료 · ${failN}개 종목 수동 입력`);
    else showToast('시세·환율 갱신 완료');
  }catch(e){
    showToast('업데이트 오류');
  }finally{
    const b=document.getElementById('stock-refresh-btn');
    if(b){b.disabled=false;b.textContent='새로고침';}
  }
}
function addSave(group,name,dir){
  const store=group==='long'?longSave:shortSave;
  if(!store[name])return;
  const monthly=store[name].monthly||0;
  const delta=monthly*dir;
  store[name].bal=Math.max(0,store[name].bal+delta);
  const mKey='savedThisMonth_'+curMonth();
  if(!store[name][mKey])store[name][mKey]=0;
  store[name][mKey]+=delta;
  saveAll();renderSavings();_restoreSavingsLock();
}

async function loadRestoreBackups(){
  const listEl=document.getElementById('restore-list');
  if(!listEl)return;
  listEl.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3)">백업 목록을 불러오는 중...</div>';
  try {
    await authReady;
    const snap = await db.ref(ROOT + '/_backups').orderByKey().get();
    if(!snap.exists()){
      listEl.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3)">저장된 백업이 없습니다.</div>';
      return;
    }
    const backups = snap.val();
    const keys = Object.keys(backups).sort().reverse();
    let html = '';
    keys.forEach(k => {
      const txCount = backups[k].txs ? backups[k].txs.length : 0;
      html += `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)">

            <div style="font-weight:600;font-size:14px;color:var(--text)">${k} 백업</div>
            <div style="font-size:11px;color:var(--text3)">거래 내역 ${txCount}건</div>
          </div>
          <button class="btn btn-sm btn-p" onclick="restoreBackup('${k}')">복구</button>
        </div>
      `;
    });
    listEl.innerHTML = html || '<div style="text-align:center;padding:20px;color:var(--text3)">저장된 백업이 없습니다.</div>';
  } catch(e) {
    console.error(e);
    listEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--red)">불러오기 실패: ${e.message}</div>`;
  }
}
async function restoreBackup(date) {
  if (!confirm(`${date} 백업으로 데이터를 복구하시겠습니까?\n복구 진행 전 현재 데이터가 자동으로 백업됩니다.`)) return;
  try {
    // 1. 현재 데이터를 '복구전' 백업으로 자동 저장
    const currentSnap = await db.ref(ROOT).get();
    if (currentSnap.exists()) {
      const currentData = currentSnap.val();
      delete currentData._backups; // 백업 내 백업 중복 방지
      const d = new Date();
      const datePart = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const timePart = String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
      const backupKey = `${datePart}_복구전_${timePart}`;
      await db.ref(ROOT + '/_backups/' + backupKey).set(currentData);
    }

    const snap = await db.ref(ROOT + '/_backups/' + date).get();
    if (!snap.exists()) {
      alert('백업 데이터를 찾을 수 없습니다.');
      return;
    }
    const backupData = snap.val();
    
    txs = backupData.txs || [];
    budgets = backupData.budgets || BUDGET_DEFAULT;
    targetBudgets = backupData.targetBudgets || [0,0,0,0,0];
    weeklyAdjustments = backupData.weeklyAdjustments || [0,0,0,0,0];
    annualEvents = backupData.annualEvents || ANNUAL_EVENTS_DEFAULT;
    longSave = backupData.longSave || LONG_SAVE_DEFAULT;
    shortSave = backupData.shortSave || SHORT_SAVE_DEFAULT;
    stockHoldings = backupData.stockHoldings || [];
    stockFx = backupData.stockFx || {rate:1380,updated:0};
    fixedCustom = (backupData.fixedCustom || []).map(normalizeFixedCustomItem).filter(Boolean);
    budgetCustom = normalizeBudgetCustom(backupData.budgetCustom || {});
    monthlyWeeklyData = backupData.monthlyWeeklyData || {};
    
    rawFixedList().forEach(i => {
      const k = fixedKey(i);
      ['_amt','_day','_hidden','_name'].forEach(s => localStorage.removeItem(k+s));
      localStorage.removeItem(varCheckKey(k, i.name));
    });
    
    if(backupData.fixedChecks) {
      Object.entries(backupData.fixedChecks).forEach(([k,v]) => {
        if(k.startsWith('var_')) localStorage.setItem(k.slice(4), v);
        else localStorage.setItem(k, v);
      });
    }
    if(backupData.fixedAmts) Object.entries(backupData.fixedAmts).forEach(([k,v])=>localStorage.setItem(k,v));
    if(backupData.fixedDays) Object.entries(backupData.fixedDays).forEach(([k,v])=>localStorage.setItem(k,v));
    if(backupData.fixedNames) Object.entries(backupData.fixedNames).forEach(([k,v])=>localStorage.setItem(k,v));
    if(backupData.fixedBudgetManual) localStorage.setItem('bch_fixed_budget_manual', backupData.fixedBudgetManual);
    if(backupData.monthlyBudgetManual) localStorage.setItem('bch_monthly_budget_manual', backupData.monthlyBudgetManual);
    if(backupData.theme) localStorage.setItem('bch_theme', backupData.theme);
    
    saveLocal();
    
    const _now = Date.now();
    myLastSaveTime = _now;
    localStorage.setItem('bch_last_updated', _now);
    
    await db.ref(ROOT).update({
      txs, budgets, targetBudgets, weeklyAdjustments, annualEvents, longSave, shortSave,
      fixedChecks: getFixedChecks(),
      fixedAmts: getFixedAmts(),
      fixedDays: getFixedDays(),
      fixedNames: getFixedNames(),
      fixedCustom,
      budgetCustom,
      fixedBudgetManual: localStorage.getItem('bch_fixed_budget_manual')||null,
      monthlyBudgetManual: localStorage.getItem('bch_monthly_budget_manual')||null,
      theme: localStorage.getItem('bch_theme')||null,
      _updated: _now
    });
    
    alert('성공적으로 복구되었습니다.');
    location.reload();
  } catch(e) {
    console.error(e);
    alert('복구 중 오류가 발생했습니다: ' + e.message);
  }
}

let fbListenerStarted = false;
function initDataListener() {
  if (fbListenerStarted) return;
  fbListenerStarted = true;

  if (!db) {
    setSyncStatus('error', 'DB 초기화 실패');
    return;
  }

  setSyncStatus('syncing');

  /* ==============================
     자동 백업 — 하루에 한 번, 그날의 마지막 동기화 상태를
     beomcho/_backups/YYYY-MM-DD 경로에 따로 저장합니다.
     실수로 데이터를 지우거나 잘못 고쳤을 때 되돌릴 수 있는 안전망 역할입니다.
     30일치만 보관하고 그보다 오래된 백업은 자동으로 정리합니다.
  ============================== */
  function todayLocalDateStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function pruneOldBackups(){
    db.ref(ROOT + '/_backups').orderByKey().get().then(snap=>{
      if(!snap.exists()) return;
      const keys = Object.keys(snap.val()).sort();
      const KEEP = 30;
      if(keys.length > KEEP){
        keys.slice(0, keys.length - KEEP).forEach(k=>{
          db.ref(ROOT + '/_backups/' + k).remove();
        });
      }
    }).catch(err=>console.error('백업 정리 실패:', err));
  }

  function maybeBackupToday(data){
    if(!data) return;
    const today = todayLocalDateStr();
    if(localStorage.getItem('bch_last_backup_date') === today) return; /* 오늘 이미 백업함 */
    const snapshotData = Object.assign({}, data);
    delete snapshotData._backups; /* 백업 안에 백업이 중첩 저장되지 않도록 제외 */
    db.ref(ROOT + '/_backups/' + today).set(snapshotData)
      .then(()=>{
        localStorage.setItem('bch_last_backup_date', today);
        pruneOldBackups();
      })
      .catch(err=>console.error('자동 백업 실패:', err));
  }

  /* Firebase 실시간 리스너 — 다른 기기에서 변경되면 자동으로 반영 */
  db.ref(ROOT).on('value', snapshot=>{
    const data=snapshot.val();
    let applied=false;
    if(data){
      const incomingTime = data._updated || 0;
      if(!isSavePending && (!fbReady || incomingTime > myLastSaveTime)){
        applyFirebaseData(data);
        applied=true;
        if(incomingTime) localStorage.setItem('bch_last_updated', incomingTime);
      }
      maybeBackupToday(data);
    }

    if(!fbReady){
      fbReady=true;
      const activePage=document.querySelector('.page.active')?.id?.replace('page-','');
      if(activePage)({home:renderHome,input:renderInput,calendar:renderCalendar,budget:renderBudget,fixed:renderFixed,savings:renderSavings})[activePage]?.();
    } else if(applied){
      /* 다른 기기에서 들어온 변경사항을 현재 보고 있는 화면에도 즉시 반영
         (단, 내가 지금 수정 모드로 입력 중이면 화면을 덮어쓰지 않음) */
      const anyEditing=dashboardEditMode||budgetEditMode||fixedEditMode||savingsEditMode||txEditMode;
      if(!anyEditing){
        const activePage=document.querySelector('.page.active')?.id?.replace('page-','');
        if(activePage)({home:renderHome,input:renderInput,calendar:renderCalendar,budget:renderBudget,fixed:renderFixed,savings:renderSavings})[activePage]?.();
      }
    }
    setSyncStatus('ok');
  },err=>{
    console.error('Firebase Read Error:', err);
    if(err.code === 'PERMISSION_DENIED') setSyncStatus('denied');
    else setSyncStatus('error', err.message);
    fbReady=true;
  });

  /* 오프라인 감지 */
  db.ref('.info/connected').on('value',snap=>{
    if(snap.val()===true){
      /* 데이터 리스너가 성공적으로 실행된 후에만 OK 표시 */
    } else {
      if(fbReady) setSyncStatus('offline');
    }
  });
}
